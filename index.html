utton class=\"po-skip\" data-act=\"back\">back\u003c/button>\u003c/div>';\n    } else {\n      body =\n        '\u003cdiv class=\"po-body\">\u003cdiv class=\"po-star\" aria-hidden>&#9733;\u003c/div>' +\n          '\u003cdiv class=\"po-show\">\u003cspan class=\"po-showD\">last session\u003c/span>\u003cspan class=\"po-showV\">' +\n            '\u003cspan class=\"po-stat\">\u003cb>' + lastSets + '\u003c/b> sets\u003c/span>' +\n            '\u003cspan class=\"po-stat\">\u003cb>' + lastReps + '\u003c/b> reps\u003c/span>' +\n            '\u003cspan class=\"po-stat\">\u003cb>' + fmtN(wDisp(lastWeight)) + '\u003c/b> ' + unit + '\u003c/span>\u003c/span>\u003c/div>' +\n          '\u003cp class=\"po-hint\">How much do you want to push today?\u003c/p>' +\n          '\u003cdiv class=\"po-choices\">\u003cbutton class=\"po-choice\" data-act=\"addrep\">add a rep\u003c/button>\u003cbutton class=\"po-choice\" data-act=\"addweight\">add ' + nudgeDefault() + ' ' + unit + '\u003c/button>\u003c/div>' +\n          (isArmed ? '\u003cbutton class=\"po-remove\" data-act=\"clear\">clear it\u003c/button>' : '') +\n          '\u003cbutton class=\"po-skip\" data-act=\"close\">not right now\u003c/button>\u003c/div>';\n    }\n    poCard.innerHTML = head + body;\n    const seed = (b && b.weightKg > 0) ? wDisp(b.weightKg) : nudgeDefault();\n    poCard.querySelectorAll('[data-act]').forEach(node => {\n      const act = node.dataset.act;\n      node.onclick = () => {\n        if (act === 'close') closeOverloadCard();\n        else if (act === 'clear') poClear();\n        else if (act === 'addrep') poApplied({ weightKg: 0, reps: 1 });\n        else if (act === 'addweight' || act === 'edit') poRender('step', seed);\n        else if (act === 'back') poRender('choices', nudgeDefault());\n        else if (act === 'minus' || act === 'plus'){\n          const inp = poCard.querySelector('#poInput');\n          let v = parseFloat(inp.value); if (!isFinite(v)) v = 0;\n          inp.value = fmtN(Math.max(0, Math.round((v + (act === 'plus' ? 1 : -1) * nudgeDefault()) * 100) / 100));\n        } else if (act === 'confirm') confirmStep();\n      };\n    });\n    const inp = poCard.querySelector('#poInput');\n    function confirmStep(){\n      const v = parseFloat(poCard.querySelector('#poInput').value);\n      if (!isFinite(v) || v \u003c= 0) return;\n      poApplied({ weightKg: wKg(v), reps: 0 });\n    }\n    if (inp) inp.onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); confirmStep(); } };\n  }\n  poModal.addEventListener('click', e => { if (e.target === poModal) closeOverloadCard(); });\n  document.addEventListener('keydown', e => { if (e.key === 'Escape' && poModal.classList.contains('on')) closeOverloadCard(); });\n\n  // The progressive-overload payoff. A lift is CONQUERED when every set is logged\n  // AND at least one done set beats the PREVIOUS best (history only, never today).\n  function prevBestOf(lift){\n    let best = null;\n    (lift.history || []).forEach(s => {\n      const w = s.w || 0, r = s.r || 0;\n      if (!best || w > best.weight || (w === best.weight && r > best.reps)) best = { weight: w, reps: r };\n    });\n    return best;\n  }\n  function beatsPrevBest(lift, set){\n    const best = prevBestOf(lift);\n    if (!best || best.weight \u003c= 0) return false;\n    if (set.weight > best.weight) return true;\n    return set.weight === best.weight && set.reps > best.reps;\n  }\n  function isConquered(lift){\n    const rows = lift.sets || [];\n    if (!rows.length) return false;\n    if (!rows.every(s => s.done || s.failed)) return false;\n    return rows.some(s => s.done && !s.failed && s.weight > 0 && s.reps > 0 && beatsPrevBest(lift, s));\n  }\n  function overloadGoalMet(lift){\n    const b = lift.overload; if (!b) return false;\n    const tW = lift.weight + (b.weightKg || 0);\n    const tR = lift.targetReps + (b.reps || 0);\n    return lift.sets.some(s => s.done && !s.failed && s.weight >= tW && s.reps >= tR);\n  }\n  function bumpLabel(b, perHand){\n    const parts = [];\n    if ((b.weightKg || 0) > 0) parts.push('+' + fmtN(wDisp(b.weightKg)) + ' ' + uLabel(perHand));\n    if ((b.reps || 0) > 0) parts.push('+' + b.reps + ' rep' + (b.reps > 1 ? 's' : ''));\n    return parts.join(' \u00b7 ') || 'no change';\n  }\n  const celebratingIds = new Set();\n  let celebratedPrev = new Set();\n  function isCompleted(lift){\n    const rows = lift.sets || [];\n    return rows.length > 0 && rows.every(s => s.done && !s.failed);\n  }\n  function currentCelebrating(){\n    const s = new Set();\n    LIFTS.filter(l => !l.hidden).forEach(l => { if (isCompleted(l)) s.add(l.id); });\n    return s;\n  }\n  function syncCelebrations(){\n    const now = currentCelebrating();\n    now.forEach(id => {\n      if (!celebratedPrev.has(id) && !celebratingIds.has(id)){\n        celebratingIds.add(id);\n        const card = listEl.querySelector('.lift[data-id=\"' + id + '\"]');\n        if (card) card.classList.add('celebrate');\n        setTimeout(() => {\n          celebratingIds.delete(id);\n          const c = listEl.querySelector('.lift[data-id=\"' + id + '\"]');\n          if (c) c.classList.remove('celebrate');\n        }, 1600);\n      }\n    });\n    celebratedPrev = now;\n  }\n\n  // date helpers shared by the finish loop and the chart handoff\n  const pad2 = n => String(n).padStart(2, '0');\n  const ymdKey = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());\n  function offsetDate(days){ const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + days); return ymdKey(d); }\n\n  // finish session: today's logged sets become a saved session, the graph grows,\n  // and the rows reset for next time. This is the loop made whole.\n  function finishSession(){\n    if (typeof rcDismiss === 'function') rcDismiss();   // ep4: a finished session has no set to rest for\n    let lifts = 0, totalSets = 0; const prs = [];\n    LIFTS.filter(l => !l.hidden).forEach(lift => {\n      const logged = lift.sets.filter(s => s.done || s.failed);\n      if (!logged.length) return;\n      const top = lift.sets.filter(s => s.done && !s.failed);\n      const kg = top.length ? Math.max(...top.map(s => s.weight)) : lift.weight;\n      const reps = top.length ? Math.max(...top.map(s => s.reps)) : 0;\n      const isPR = lift.sets.some(s => s.done && !s.failed && beatsPrevBest(lift, s));\n      lift.history = (lift.history || []).concat({ w: kg, r: reps, date: offsetDate(0), sets: logged.map(s => ({ r: s.reps || 0, fail: !!s.failed })) });\n      if (top.length) lift.weight = kg;\n      lift.overload = null;\n      lift.sets = blankSets(lift.targetSets);\n      lifts++; totalSets += logged.length;\n      if (isPR) prs.push({ name: lift.name, kg, perHand: lift.perHand });\n    });\n    if (!lifts) return;\n    saveLog(); render();\n    showCelebration(lifts, totalSets, prs);\n  }\n  function showCelebration(lifts, totalSets, prs){\n    const cele = document.getElementById('cele');\n    const star = '\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cdefs>\u003clinearGradient id=\"celeGrad\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\u003cstop offset=\"0\" stop-color=\"#fbe9b0\"/>\u003cstop offset=\"1\" stop-color=\"#e0a83a\"/>\u003c/linearGradient>\u003c/defs>\u003cpath fill=\"url(#celeGrad)\" d=\"M12 2l2.9 6.1 6.6.9-4.8 4.6 1.2 6.6L12 18.5 6.1 20.8l1.2-6.6L2.5 9.6l6.6-.9z\"/>\u003c/svg>';\n    const sparks = Array.from({ length: 8 }, (_, i) => {\n      const a = (i / 8) * 6.2832, r = 40, dx = Math.cos(a) * r, dy = Math.sin(a) * r;\n      return '\u003cspan class=\"cele-spark\" style=\"--dx:' + dx.toFixed(1) + 'px;--dy:' + dy.toFixed(1) + 'px;animation-delay:' + (0.12 + i * 0.025).toFixed(3) + 's' + (i % 2 ? ';background:var(--mint)' : '') + '\">\u003c/span>';\n    }).join('');\n    const prLines = prs.map(p => '\u003cdiv class=\"cele-pr\">' + SVG(ICON.star) + 'New best &middot; ' + esc(p.name) + ' ' + wDisp(p.kg) + ' ' + uLabel(p.perHand) + '\u003c/div>').join('');\n    document.getElementById('celeCard').innerHTML =\n      '\u003cdiv class=\"cele-star\" aria-hidden=\"true\">' + sparks + star + '\u003c/div>' +\n      '\u003cdiv class=\"cele-eyebrow\">Workout submitted\u003c/div>' +\n      '\u003ch2 class=\"cele-title\">Nice work.\u003c/h2>' +\n      '\u003cp class=\"cele-sub\">Your graph just grew.\u003c/p>' +\n      '\u003cdiv class=\"cele-stats\">' +\n        '\u003cdiv class=\"cele-stat\">\u003cdiv class=\"cele-statN\">' + totalSets + '\u003c/div>\u003cdiv class=\"cele-statK\">set' + (totalSets > 1 ? 's' : '') + '\u003c/div>\u003c/div>' +\n        '\u003cdiv class=\"cele-statDiv\">\u003c/div>' +\n        '\u003cdiv class=\"cele-stat\">\u003cdiv class=\"cele-statN\">' + lifts + '\u003c/div>\u003cdiv class=\"cele-statK\">lift' + (lifts > 1 ? 's' : '') + '\u003c/div>\u003c/div>' +\n      '\u003c/div>' +\n      (prLines ? '\u003cdiv class=\"cele-prs\">' + prLines + '\u003c/div>' : '') +\n      '\u003cbutton class=\"cele-done\" id=\"celeDone\">Done\u003c/button>';\n    cele.classList.add('on');\n    document.getElementById('celeDone').onclick = () => cele.classList.remove('on');\n  }\n  const finishBtn = document.getElementById('finishBtn');\n  finishBtn.onclick = finishSession;\n  function paintFinish(){\n    let logged = 0;\n    LIFTS.filter(l => !l.hidden).forEach(l => l.sets.forEach(s => { if (s.done || s.failed) logged++; }));\n    finishBtn.disabled = logged === 0;\n    const cap = document.getElementById('finishCap');\n    cap.classList.remove('saved');\n    cap.textContent = logged\n      ? 'Saves ' + logged + ' logged set' + (logged > 1 ? 's' : '') + ' as today\u2019s session'\n      : 'Log a set to finish your session';\n  }\n  // @episode-end:logger\n\n  // @episode-start:library\n  // THE EXERCISE LIBRARY. The front door to your lifts: open it to ADD a lift to\n  // today, or SWAP one for another. Search or scroll by muscle group, tap i for a\n  // lift's form card, tap the check to drop it into today's session. Every add\n  // writes through the SAME store.\n  const libOverlay = document.getElementById('libOverlay');\n  const GROUP_ORDER = [['chest','Chest'],['back','Back'],['shoulders','Shoulders'],['arms','Arms'],['legs','Legs'],['core','Core']];\n  let libMode = 'add';\n  let libSwapTarget = null;\n  function inSession(e){ return LIFTS.some(l => !l.hidden && (l.libKey === e.key || l.name === e.name)); }\n  function addFromLibrary(e){\n    const existing = LIFTS.find(l => l.libKey === e.key || l.name === e.name);\n    if (existing){ if (existing.hidden){ existing.hidden = false; saveLog(); render(); } return; }\n    const d = tierDefaults(e.tier);\n    addLift({ name:e.name, tier:e.tier, muscle:e.group, libKey:e.key, perHand:e.equip === 'dumbbell',\n      targetSets:d.targetSets, targetReps:d.targetReps, weight:d.weight, history:[], sets:blankSets(d.targetSets) });\n    render();\n  }\n  function removeFromLibrary(e){\n    LIFTS.forEach(l => { if (!l.hidden && (l.libKey === e.key || l.name === e.name)) l.hidden = true; });\n    saveLog(); render();\n  }\n  function clearOverloadStore(id){ try { localStorage.removeItem('vitality.overload.' + id + '.v3'); } catch(e){} }\n  function swapForLibrary(entry){\n    if (!libSwapTarget) return;\n    const dup = LIFTS.find(l => !l.hidden && l.id !== libSwapTarget.id && (l.libKey === entry.key || l.name === entry.name));\n    if (dup){ clearOverloadStore(libSwapTarget.id); updateLift(libSwapTarget.id, { hidden: true }); render(); closeLibrary(); return; }\n    const d = tierDefaults(entry.tier);\n    const newPerHand = entry.equip === 'dumbbell';\n    clearOverloadStore(libSwapTarget.id);\n    updateLift(libSwapTarget.id, l => {\n      let weight = l.weight;\n      if (weight != null){\n        if (newPerHand && !l.perHand) weight = round05(weight / 2);\n        else if (!newPerHand && l.perHand) weight = round05(weight * 2);\n      }\n      return { name:entry.name, muscle:entry.group, libKey:entry.key, tier:entry.tier, perHand:newPerHand,\n        weight, targetSets:d.targetSets, targetReps:d.targetReps, history:[], overload:null, sets: blankSets(d.targetSets) };\n    });\n    render(); closeLibrary();\n  }\n  let libAnimOnce = false;\n  function openLibrary(){ libMode='add'; libSwapTarget=null; buildLibraryShell(); libAnimOnce = true; renderLibRows(''); document.body.classList.add('lib-browsing'); libOverlay.classList.add('on'); }\n  function openLibrarySwap(lift){ libMode='swap'; libSwapTarget=lift; buildLibraryShell(); libAnimOnce = true; renderLibRows(''); document.body.classList.add('lib-browsing'); libOverlay.classList.add('on'); }\n  function closeLibrary(){ libOverlay.classList.remove('on'); document.body.classList.remove('lib-browsing'); libMode='add'; libSwapTarget=null; }\n  function buildLibraryShell(){\n    const swap = libMode === 'swap';\n    libOverlay.innerHTML =\n      '\u003csvg class=\"lib-mtn\" viewBox=\"0 0 1200 220\" preserveAspectRatio=\"none\" aria-hidden=\"true\">' +\n        '\u003cpath d=\"M0 220V150L150 112L330 150L520 96L720 150L900 112L1080 150L1200 122V220Z\" fill=\"hsl(var(--hue) 35% 7%)\" opacity=\".5\"/>' +\n        '\u003cpath d=\"M0 220V176L180 142L380 180L560 132L760 180L980 142L1200 176V220Z\" fill=\"hsl(var(--hue) 43% 4%)\" opacity=\".92\"/>' +\n      '\u003c/svg>' +\n      '\u003cdiv class=\"lib-wrap\">' +\n        '\u003cdiv class=\"lib-top\">' +\n          '\u003cbutton class=\"lib-back\" id=\"libBack\">' + SVG('\u003cpath d=\"M15 5l-7 7 7 7\"/>') + (swap ? 'cancel' : 'session') + '\u003c/button>' +\n          '\u003cspan class=\"lib-sp\">\u003c/span>' +\n          '\u003cspan class=\"lib-count\" id=\"libCount\">\u003c/span>' +\n        '\u003c/div>' +\n        '\u003ch1 class=\"lib-title\">' + (swap ? 'Swap' : 'Library') + '\u003c/h1>' +\n        (swap ? '\u003cp class=\"lib-sub\">Pick a replacement for ' + esc(libSwapTarget ? libSwapTarget.name : '') + '. Your weight carries over.\u003c/p>' : '') +\n        '\u003cdiv class=\"lib-search\">' + SVG('\u003ccircle cx=\"11\" cy=\"11\" r=\"7\"/>\u003cpath d=\"M21 21l-4.3-4.3\"/>') +\n          '\u003cinput id=\"libSearch\" placeholder=\"Search any exercise...\" autocomplete=\"off\">\u003c/div>' +\n        '\u003cdiv id=\"libList\">\u003c/div>' +\n      '\u003c/div>';\n    document.getElementById('libBack').onclick = closeLibrary;\n    const search = document.getElementById('libSearch');\n    search.oninput = () => renderLibRows(search.value);\n  }\n  function renderLibRows(q){\n    const raw = (q || '').trim();\n    const query = raw.toLowerCase();\n    const swap = libMode === 'swap';\n    document.getElementById('libCount').innerHTML = swap ? '' : '\u003cb>' + LIFTS.filter(l => !l.hidden).length + '\u003c/b> in your session';\n    const html = GROUP_ORDER.map(([g, label]) => {\n      const items = LIB.filter(e => e.group === g && (!query || e.name.toLowerCase().includes(query) || e.muscles.toLowerCase().includes(query)));\n      if (!items.length) return '';\n      const rows = items.map(e => {\n        const isIn = !swap && inSession(e);\n        const control = swap\n          ? '\u003cspan class=\"lib-pick\">' + SVG('\u003cpath d=\"M4 12h14M13 7l5 5-5 5\"/>') + '\u003c/span>'\n          : '\u003cbutton class=\"lib-check' + (isIn ? ' on' : '') + '\" data-act=\"toggle\" aria-label=\"Add or remove\">' + SVG('\u003cpath d=\"M5 12l4 4 10-11\"/>') + '\u003c/button>';\n        return '\u003cdiv class=\"lib-row' + (swap ? ' pick' : '') + '\" data-key=\"' + e.key + '\">' +\n          control +\n          '\u003cspan class=\"lib-gly\">' + SVG(GLYPH[e.group] || GLYPH.chest) + '\u003c/span>' +\n          '\u003cspan class=\"lib-main\">\u003cspan class=\"lib-nm\">' + esc(e.name) + '\u003c/span>\u003c/span>' +\n          '\u003cbutton class=\"lib-i\" data-act=\"info\" aria-label=\"How to do it\">i\u003c/button>' +\n        '\u003c/div>';\n      }).join('');\n      return '\u003cdiv class=\"lib-sec\">\u003cdiv class=\"lib-sec-h\">\u003cb>' + label + '\u003c/b>\u003cspan class=\"lib-sec-n\">' + items.length + '\u003c/span>\u003c/div>' + rows + '\u003c/div>';\n    }).join('');\n    const exact = LIB.some(e => e.name.toLowerCase() === query);\n    const createRow = (raw && !exact)\n      ? '\u003cbutton class=\"lib-create\" id=\"libCreate\">' + SVG('\u003cpath d=\"M12 5v14M5 12h14\"/>') + (swap ? 'Swap for' : 'Add') + ' &ldquo;' + esc(raw) + '&rdquo; as your own\u003c/button>'\n      : '';\n    const list = document.getElementById('libList');\n    list.innerHTML = createRow + html;\n    if (!html && !createRow) list.innerHTML = '\u003cdiv class=\"lib-empty\">No lifts match that.\u003c/div>';\n    // cozy stagger only on open; retyping a search repaints instantly\n    if (libAnimOnce){ libAnimOnce = false; list.querySelectorAll('.lib-row').forEach((r, i) => r.style.setProperty('--i', Math.min(i, 14))); }\n    else list.querySelectorAll('.lib-row').forEach(r => { r.style.animation = 'none'; });\n    const create = document.getElementById('libCreate');\n    if (create) create.onclick = () => {\n      if (swap && libSwapTarget){\n        const dupN = LIFTS.find(l => !l.hidden && l.id !== libSwapTarget.id && l.name.toLowerCase() === raw.toLowerCase());\n        if (dupN){ clearOverloadStore(libSwapTarget.id); updateLift(libSwapTarget.id, { hidden: true }); render(); closeLibrary(); return; }\n        clearOverloadStore(libSwapTarget.id);\n        updateLift(libSwapTarget.id, l => ({ name: raw, muscle: guessMuscle(raw) || 'chest', libKey: null, perHand: l.perHand,\n          history:[], overload:null, sets: blankSets(l.targetSets) }));\n        render(); closeLibrary();\n      }\n      else { quickAddLift(raw); closeLibrary(); }\n    };\n    list.querySelectorAll('.lib-row').forEach(row => {\n      const e = libByKey[row.dataset.key];\n      row.querySelector('[data-act=\"info\"]').onclick = (ev) => { ev.stopPropagation(); openInfo({ name:e.name, tier:e.tier, libKey:e.key }); };\n      if (swap){ row.onclick = () => swapForLibrary(e); }\n      else { row.querySelector('[data-act=\"toggle\"]').onclick = () => { inSession(e) ? removeFromLibrary(e) : addFromLibrary(e); renderLibRows(document.getElementById('libSearch').value); }; }\n    });\n  }\n  document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && libOverlay.classList.contains('on') && !modal.classList.contains('on')) closeLibrary(); });\n  // @episode-end:library\n\n  // @episode-start:chart\n  // THE PROGRESSIVE-OVERLOAD CHART (Episode 1), drawn inline. \"history\" hands off\n  // this lift's sessions into CHART_STATE and opens the overlay; the chart reads\n  // them and draws its own line, best-marker, scrub, stats, and editable log. No\n  // iframe, no second file: the same chart the /overload command wires into a real\n  // app, living right here in the logger. Editing a past session here writes back\n  // to the lift's history through the ONE store, so the logger stays in sync.\n  const CH_DAY = 86400000;\n  const chToday = new Date(); chToday.setHours(0, 0, 0, 0);\n  const chYmd = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());\n  const chParse = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };\n  const chDaysAgo = k => Math.round((chToday - chParse(k)) / CH_DAY);\n  const chLabel = k => chParse(k).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });\n  const chR1 = n => Math.round(n * 10) / 10;\n  const chSetCount = p => (p.sets || []).length;\n  const chTopReps = p => { const d = (p.sets || []).filter(s => !s.fail).map(s => s.r); return d.length ? Math.max(...d) : 0; };\n  const chTotalReps = p => (p.sets || []).reduce((a, s) => a + (s.r || 0), 0);\n\n  // per-unit display, matched to the logger's toggle\n  const chWD = kg => UNIT === 'lb' ? Math.round(kg / LB * 2) / 2 : Math.round(kg * 100) / 100;\n  const chWKg = v => UNIT === 'lb' ? Math.round(v * LB * 1000) / 1000 : v;\n\n  const CH_RANGES = { W: 7, M: 30, '3M': 90, '6M': 180, Y: 365, ALL: 99999 };\n  const CH_VB_W = 600, CH_VB_H = 240, CH_PADL = 46, CH_PADR = 20, CH_PADT = 22, CH_PADB = 36;\n\n  // CHART_STATE holds the lift being viewed and its sessions (in kg). openOverload\n  // builds it from a lift; saving an edit writes back to lift.history.\n  let CHART = { liftId: null, name: '', perHand: false, U: 'kg', UD: 'kg', LOG: [], active: 'ALL', setIdx: null };\n\n  const ep1Overlay = document.getElementById('ep1Overlay');\n  const ep1Shell = document.getElementById('ep1Shell');\n\n  // turn a lift's history (+ today's logged sets) into the chart's session shape\n  function liftSessions(lift){\n    const h = lift.history || [];\n    const sessions = h.map((s, i) => ({\n      date: s.date || offsetDate(-((h.length - i) * 4 + 1)),\n      kg: s.w,\n      sets: s.sets || Array.from({ length: Math.max(1, lift.targetSets) }, () => ({ r: s.r }))\n    }));\n    const logged = lift.sets.filter(s => s.done || s.failed);\n    if (logged.length){\n      const top = lift.sets.filter(s => s.done && !s.failed);\n      sessions.push({\n        date: offsetDate(0),\n        kg: top.length ? Math.max(...top.map(s => s.weight)) : lift.weight,\n        sets: logged.map(s => ({ r: s.reps || 0, fail: !!s.failed }))\n      });\n    }\n    return sessions;\n  }\n  function openOverload(lift){\n    const unit = uLabel(lift.perHand);\n    CHART = { liftId: lift.id, name: lift.name, perHand: !!lift.perHand, U: unit, UD: UNIT,\n      LOG: liftSessions(lift), active: 'ALL', setIdx: null };\n    chSortLog();\n    buildChartShell();\n    chRender();\n    chWireStrip();\n    ep1Overlay.classList.add('on');\n  }\n  function closeEp1(){ ep1Overlay.classList.remove('on'); }\n  document.getElementById('ep1Close').onclick = closeEp1;\n  document.addEventListener('keydown', e => { if (e.key === 'Escape' && ep1Overlay.classList.contains('on')) closeEp1(); });\n\n  function chSortLog(){ CHART.LOG.sort((a, b) => a.date.localeCompare(b.date)); }\n  function chVisible(){ const w = CH_RANGES[CHART.active]; return CHART.LOG.filter(p => chDaysAgo(p.date) \u003c= w); }\n  function chReals(list){ return list.filter(p => !p.off); }\n  function chOffs(list){ return list.filter(p => p.off); }\n  function chBestSession(){ const r = chReals(CHART.LOG); if (!r.length) return null; return r.reduce((b, p) => (p.kg > b.kg || (p.kg === b.kg && chTopReps(p) > chTopReps(b))) ? p : b); }\n  function chPrevReal(dateKey){ const before = chReals(CHART.LOG).filter(p => p.date \u003c dateKey); return before.length ? before[before.length - 1] : null; }\n\n  function buildChartShell(){\n    ep1Shell.innerHTML =\n      '\u003cdiv class=\"ch-sheet\">' +\n        '\u003cdiv class=\"ch-head\">\u003cdiv>\u003cdiv class=\"ch-eyebrow\">History\u003c/div>\u003cdiv class=\"ch-title\" id=\"chTitle\">\u003c/div>\u003c/div>\u003c/div>' +\n        '\u003cdiv class=\"ch-range\" id=\"chRange\">\u003c/div>' +\n        '\u003cdiv class=\"ch-plotcard\">' +\n          '\u003cdiv class=\"ch-plot\" id=\"chPlot\">\u003cdiv class=\"ch-scrub\" id=\"chScrub\">\u003c/div>\u003c/div>' +\n          '\u003cdiv class=\"ch-cap\" id=\"chCap\">\u003c/div>' +\n          '\u003cdiv class=\"ch-lastsets\" id=\"chLastsets\">\u003c/div>' +\n        '\u003c/div>' +\n        '\u003cdiv class=\"ch-stats\" id=\"chStats\">\u003c/div>' +\n        '\u003cdiv class=\"ch-next\" id=\"chNext\">\u003c/div>' +\n        '\u003ctable class=\"ch-table\">\u003cthead>\u003ctr>\u003cth>Date\u003c/th>\u003cth>Sets\u003c/th>\u003cth>Reps\u003c/th>\u003cth>Weight\u003c/th>\u003cth>Progress\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"chTbody\">\u003c/tbody>\u003c/table>' +\n        '\u003cdiv class=\"editor\" id=\"chEditor\">\u003c/div>' +\n        '\u003cbutton class=\"logbtn\" id=\"chLogbtn\">\u003csvg viewBox=\"0 0 24 24\" style=\"width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round\">\u003cpath d=\"M12 5v14M5 12h14\"/>\u003c/svg> Log a past session\u003c/button>' +\n        '\u003cp class=\"ch-note\">These sessions come from your logged workouts. Edit one here and the change flows back to the lift.\u003c/p>' +\n      '\u003c/div>';\n    document.getElementById('chTitle').textContent = CHART.name || 'History';\n    document.getElementById('chLogbtn').onclick = () => chOpenEditor(null);\n    // reuse the editor styles from overload.html by mapping to logger tokens below\n  }\n\n  function chRender(){ chBuildRange(); chRenderChart(); chRenderLastSets(); chRenderStats(); chRenderNext(); chRenderTable(); chWriteBack(); }\n\n  // whenever the chart mutates a session, persist it back onto the lift's history\n  function chWriteBack(){\n    const lift = getLift(CHART.liftId); if (!lift) return;\n    // only sessions strictly before today are real history; today is live logging\n    const past = CHART.LOG.filter(p => p.date !== offsetDate(0));\n    lift.history = past.map(p => ({ w: p.kg, r: chTopReps(p), date: p.date, sets: (p.sets || []).map(s => ({ r: s.r, fail: !!s.fail })), ...(p.off ? { off: p.off } : {}) }));\n    saveLog();\n  }\n\n  function chBuildRange(){\n    const el = document.getElementById('chRange');\n    el.innerHTML = Object.keys(CH_RANGES).map(k => '\u003cbutton class=\"' + (k === CHART.active ? 'on' : '') + '\" data-r=\"' + k + '\">' + k + '\u003c/button>').join('');\n    el.querySelectorAll('button').forEach(b => b.onclick = () => { CHART.active = b.dataset.r; chRender(); });\n  }\n\n  let chCurX = () => 0, chCurY = () => 0, chCurAll = [];\n  const chPlot = () => document.getElementById('chPlot');\n  const chScrub = () => document.getElementById('chScrub');\n\n  function chRenderChart(){\n    const plot = chPlot();\n    const list = chVisible(); const real = chReals(list), off = chOffs(list);\n    if (!list.length){\n      const prev = plot.querySelector('svg'); if (prev) prev.remove();\n      plot.insertAdjacentHTML('afterbegin', '\u003csvg viewBox=\"0 0 ' + CH_VB_W + ' ' + CH_VB_H + '\" preserveAspectRatio=\"none\">\u003cline class=\"ch-grid\" x1=\"' + CH_PADL + '\" y1=\"' + (CH_VB_H - CH_PADB) + '\" x2=\"' + (CH_VB_W - CH_PADR) + '\" y2=\"' + (CH_VB_H - CH_PADB) + '\"/>\u003ctext class=\"ch-xlab\" x=\"' + (CH_VB_W / 2) + '\" y=\"' + ((CH_VB_H - CH_PADB) / 2 + 4) + '\" text-anchor=\"middle\">log your first session below\u003c/text>\u003c/svg>');\n      chCurAll = []; document.getElementById('chCap').textContent = ''; return;\n    }\n    const ws = list.map(p => p.kg);\n    const lo = Math.max(0, Math.floor(Math.min(...ws) / 5) * 5 - 5);\n    let hi = Math.ceil(Math.max(...ws) / 5) * 5 + 5;\n    if (hi - lo \u003c 10) hi = lo + 10; if ((hi - lo) % 10 !== 0) hi += 5;\n    const oldestAgo = Math.max(...list.map(p => chDaysAgo(p.date)));\n    const domain = CHART.active === 'ALL' ? Math.max(oldestAgo, 1) : Math.max(CH_RANGES[CHART.active], 1);\n    const X = k => { const f = Math.min(1, Math.max(0, 1 - chDaysAgo(k) / domain)); return CH_PADL + f * (CH_VB_W - CH_PADL - CH_PADR); };\n    const Y = kg => (CH_VB_H - CH_PADB) - (kg - lo) / (hi - lo) * (CH_VB_H - CH_PADB - CH_PADT);\n    chCurX = p => X(p.date); chCurY = p => Y(p.kg); chCurAll = list;\n    const step = (hi - lo) \u003c= 30 ? 5 : 10;\n    let svg = '\u003csvg viewBox=\"0 0 ' + CH_VB_W + ' ' + CH_VB_H + '\" preserveAspectRatio=\"none\">';\n    svg += '\u003cdefs>\u003clinearGradient id=\"chFill\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\u003cstop offset=\"0\" style=\"stop-color:var(--mint);stop-opacity:.22\"/>\u003cstop offset=\"1\" style=\"stop-color:var(--mint);stop-opacity:0\"/>\u003c/linearGradient>\u003c/defs>';\n    for (let kg = lo; kg \u003c= hi; kg += step){\n      svg += '\u003cline class=\"ch-grid\" x1=\"' + CH_PADL + '\" y1=\"' + Y(kg) + '\" x2=\"' + (CH_VB_W - CH_PADR) + '\" y2=\"' + Y(kg) + '\"/>';\n      svg += '\u003ctext class=\"ch-axis\" x=\"' + (CH_PADL - 10) + '\" y=\"' + (Y(kg) + 4) + '\" text-anchor=\"end\">' + chWD(kg) + '\u003c/text>';\n    }\n    const best = chBestSession();\n    if (real.length){\n      const pts = real.map(p => X(p.date) + ',' + Y(p.kg));\n      const last = real[real.length - 1], first = real[0];\n      if (real.length > 1){\n        svg += '\u003cpath class=\"ch-area\" d=\"M' + X(first.date) + ',' + (CH_VB_H - CH_PADB) + ' L' + pts.join(' L') + ' L' + X(last.date) + ',' + (CH_VB_H - CH_PADB) + ' Z\"/>';\n        svg += '\u003cpolyline class=\"ch-line\" points=\"' + pts.join(' ') + '\"/>';\n      }\n      svg += '\u003cline class=\"ch-drop\" x1=\"' + X(last.date) + '\" y1=\"' + Y(last.kg) + '\" x2=\"' + X(last.date) + '\" y2=\"' + (CH_VB_H - CH_PADB) + '\"/>';\n      if (chDaysAgo(last.date) >= 2) svg += '\u003ctext class=\"ch-xlab best\" x=\"' + X(last.date) + '\" y=\"' + (CH_VB_H - CH_PADB + 20) + '\" text-anchor=\"middle\">' + chLabel(last.date) + '\u003c/text>';\n    }\n    svg += '\u003cline id=\"chGuide\" class=\"ch-guide\" y1=\"' + CH_PADT + '\" y2=\"' + (CH_VB_H - CH_PADB) + '\"/>';\n    off.forEach(p => { svg += '\u003ccircle class=\"ch-dot off\" cx=\"' + X(p.date) + '\" cy=\"' + Y(p.kg) + '\" r=\"5\"/>'; });\n    real.forEach(p => { svg += '\u003ccircle class=\"ch-dot' + (best && p.date === best.date ? ' best' : '') + '\" cx=\"' + X(p.date) + '\" cy=\"' + Y(p.kg) + '\" r=\"5\"/>'; });\n    svg += '\u003ccircle id=\"chCursor\" class=\"ch-cursor\" r=\"7\"/>';\n    const oldest = list[0];\n    svg += '\u003ctext class=\"ch-xlab\" x=\"' + CH_PADL + '\" y=\"' + (CH_VB_H - 6) + '\" text-anchor=\"start\">' + chLabel(oldest.date) + '\u003c/text>';\n    svg += '\u003ctext class=\"ch-xlab\" x=\"' + (CH_VB_W - CH_PADR) + '\" y=\"' + (CH_VB_H - 6) + '\" text-anchor=\"end\">today\u003c/text>';\n    svg += '\u003c/svg>';\n    const old = plot.querySelector('svg'); if (old) old.remove();\n    plot.insertAdjacentHTML('afterbegin', svg);\n    // the reveal: the line draws itself left to right, then the dots land on it\n    const lineEl = plot.querySelector('.ch-line');\n    if (lineEl && lineEl.getTotalLength){\n      const L = lineEl.getTotalLength();\n      lineEl.style.strokeDasharray = L; lineEl.style.strokeDashoffset = L;\n      requestAnimationFrame(() => {\n        lineEl.style.transition = 'stroke-dashoffset .85s cubic-bezier(.16,1,.3,1)';\n        lineEl.style.strokeDashoffset = '0';\n      });\n    }\n    plot.querySelectorAll('.ch-dot').forEach((d, i) => {\n      d.style.opacity = '0';\n      requestAnimationFrame(() => {\n        d.style.transition = 'opacity .45s ease ' + (0.3 + i * 0.05) + 's';\n        d.style.opacity = '';\n      });\n    });\n    chRenderCaption(real);\n  }\n  function chScrubAt(clientX){\n    if (!chCurAll.length) return;\n    const svg = chPlot().querySelector('svg'); if (!svg) return;\n    const r = svg.getBoundingClientRect();\n    const vx = (clientX - r.left) / r.width * CH_VB_W;\n    let best = chCurAll[0], bd = Infinity;\n    chCurAll.forEach(p => { const dx = Math.abs(chCurX(p) - vx); if (dx \u003c bd){ bd = dx; best = p; } });\n    chShowTag(best);\n  }\n  function chShowTag(p){\n    const prev = chPrevReal(p.date);\n    let dl = '\u003cspan class=\"dl off\">rest day, off the line\u003c/span>';\n    if (!p.off){ const d = prev ? chR1(chWD(p.kg) - chWD(prev.kg)) : null; dl = '\u003cspan class=\"dl\">' + (d == null ? 'first session' : (d >= 0 ? '+' : '') + d + ' ' + CHART.UD + ' vs last') + '\u003c/span>'; }\n    const scrub = chScrub();\n    scrub.innerHTML = '\u003cdiv class=\"d\">' + chLabel(p.date) + ' &middot; ' + chSetCount(p) + ' sets, top ' + chTopReps(p) + '\u003c/div>\u003cdiv class=\"v\">' + chWD(p.kg) + ' \u003csmall>' + CHART.U + '\u003c/small>\u003c/div>' + dl;\n    scrub.style.left = (chCurX(p) / CH_VB_W * 100) + '%'; scrub.style.top = (chCurY(p) / CH_VB_H * 100) + '%'; scrub.classList.add('on');\n    const g = document.getElementById('chGuide'), c = document.getElementById('chCursor');\n    if (g){ g.setAttribute('x1', chCurX(p)); g.setAttribute('x2', chCurX(p)); g.classList.add('on'); }\n    if (c){ c.setAttribute('cx', chCurX(p)); c.setAttribute('cy', chCurY(p)); const best = chBestSession(); c.setAttribute('class', 'ch-cursor on' + (p.off ? ' off' : (best && p.date === best.date ? ' best' : ''))); }\n  }\n  function chHideTag(){ const scrub = chScrub(); if (scrub) scrub.classList.remove('on'); const g = document.getElementById('chGuide'); if (g) g.classList.remove('on'); const c = document.getElementById('chCursor'); if (c) c.classList.remove('on'); }\n  // plot pointer wiring (delegated to the live plot each render via the overlay)\n  ep1Overlay.addEventListener('pointerdown', e => { if (e.target.closest('#chPlot')){ chDragging = true; chScrubAt(e.clientX); } });\n  ep1Overlay.addEventListener('pointermove', e => { if (e.target.closest('#chPlot') && (chDragging || e.pointerType === 'mouse')) chScrubAt(e.clientX); });\n  ep1Overlay.addEventListener('pointerup', () => { chDragging = false; });\n  let chDragging = false;\n\n  function chRenderCaption(real){\n    const cap = document.getElementById('chCap');\n    if (real.length \u003c 2){ cap.textContent = real.length ? 'one session here' : 'no sessions in range'; return; }\n    const d = chR1(chWD(real[real.length - 1].kg) - chWD(real[0].kg));\n    const span = CHART.active === 'ALL' ? 'all time' : 'in ' + CHART.active;\n    cap.textContent = (d >= 0 ? '+' : '') + d + ' ' + CHART.UD + ' \u00b7 ' + span;\n  }\n  function chStripIdx(){ const r = chReals(CHART.LOG); if (!r.length) return -1; return CHART.setIdx == null ? r.length - 1 : Math.min(Math.max(CHART.setIdx, 0), r.length - 1); }\n  function chRenderLastSets(){\n    const r = chReals(CHART.LOG); const el = document.getElementById('chLastsets');\n    if (!r.length){ el.innerHTML = '\u003cspan class=\"when\">no logged sessions yet\u003c/span>'; return; }\n    const i = chStripIdx(); const s = r[i];\n    const boxes = (s.sets || []).map(st => '\u003cdiv class=\"ch-setbox' + (st.fail ? ' fail' : '') + '\">' + st.r + '\u003c/div>').join('');\n    const many = r.length > 1;\n    el.innerHTML = '\u003cspan class=\"when\">' + chLabel(s.date) + '\u003c/span>' +\n      (many ? '\u003cbutton class=\"ch-chev\" data-d=\"-1\"' + (i === 0 ? ' disabled' : '') + '>&lsaquo;\u003c/button>' : '') +\n      '\u003cdiv class=\"ch-boxes\">' + boxes + '\u003c/div>' +\n      (many ? '\u003cbutton class=\"ch-chev\" data-d=\"1\"' + (i === r.length - 1 ? ' disabled' : '') + '>&rsaquo;\u003c/button>' : '') +\n      '\u003cspan class=\"ch-repstotal\">' + chTotalReps(s) + ' reps\u003c/span>';\n    el.querySelectorAll('.ch-chev').forEach(b => b.onclick = () => chStepStrip(+b.dataset.d));\n  }\n  function chStepStrip(delta){ const r = chReals(CHART.LOG); if (r.length \u003c 2) return; const cur = chStripIdx(); const n = Math.min(Math.max(cur + delta, 0), r.length - 1); if (n !== cur){ CHART.setIdx = n; chRenderLastSets(); } }\n  function chWireStrip(){\n    const ls = document.getElementById('chLastsets'); if (!ls) return;\n    let down = false, startX = 0, startIdx = 0;\n    ls.addEventListener('pointerdown', e => { if (e.target.closest('.ch-chev')) return; down = true; startX = e.clientX; startIdx = chStripIdx(); ls.classList.add('dragging'); });\n    ls.addEventListener('pointermove', e => { if (!down) return; const r = chReals(CHART.LOG); const target = Math.min(Math.max(startIdx - Math.round((e.clientX - startX) / 46), 0), r.length - 1); if (target !== chStripIdx()){ CHART.setIdx = target; chRenderLastSets(); } });\n    const end = () => { down = false; ls.classList.remove('dragging'); };\n    ls.addEventListener('pointerup', end); ls.addEventListener('pointercancel', end);\n  }\n  function chRenderStats(){\n    const r = chReals(CHART.LOG); const best = r.length ? Math.max(...r.map(p => p.kg)) : 0;\n    const win30 = r.filter(p => chDaysAgo(p.date) \u003c= 30); const d30 = win30.length >= 2 ? chR1(chWD(win30[win30.length - 1].kg) - chWD(win30[0].kg)) : 0;\n    document.getElementById('chStats').innerHTML =\n      '\u003cdiv class=\"ch-stat\">\u003cdiv class=\"k\">Sessions\u003c/div>\u003cdiv class=\"v\">' + r.length + '\u003c/div>\u003c/div>' +\n      '\u003cdiv class=\"ch-stat\">\u003cdiv class=\"k\">Last 30 days\u003c/div>\u003cdiv class=\"v up\">' + (d30 >= 0 ? '+' : '') + d30 + ' ' + CHART.UD + '\u003c/div>\u003c/div>' +\n      '\u003cdiv class=\"ch-stat\">\u003cdiv class=\"k\">Best\u003c/div>\u003cdiv class=\"v gold\">' + chWD(best) + ' ' + CHART.UD + '\u003c/div>\u003c/div>';\n  }\n  function chRenderNext(){\n    const b = chBestSession(); const el = document.getElementById('chNext');\n    if (!b){ el.style.display = 'none'; return; }\n    el.style.display = 'flex';\n    const tr = chTopReps(b), heavier = b.kg + (UNIT === 'lb' ? chWKg(5) : 2.5);\n    el.innerHTML = '\u003cdiv class=\"star\">\u003csvg viewBox=\"0 0 24 24\">\u003cpath d=\"M12 2l2.9 6.1 6.6 .9-4.8 4.6 1.2 6.6L12 18.5 6.1 20.8l1.2-6.6L2.5 9.6l6.6-.9z\"/>\u003c/svg>\u003c/div>' +\n      '\u003cdiv class=\"copy\">Your best is \u003cb>' + chWD(b.kg) + ' ' + CHART.U + ' &times; ' + tr + '\u003c/b>. Beat it next session: \u003cspan class=\"goal\">' + chWD(heavier) + ' ' + CHART.UD + '\u003c/span>, or \u003cspan class=\"goal\">' + chWD(b.kg) + ' ' + CHART.U + ' &times; ' + (tr + 1) + '\u003c/span>.\u003c/div>';\n  }\n  function chRenderTable(){\n    const moon = '\u003cspan class=\"ch-moon\">\u003csvg viewBox=\"0 0 24 24\">\u003cpath d=\"M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z\"/>\u003c/svg>rest\u003c/span>';\n    const rows = CHART.LOG.slice().reverse().map((p, ri) => {\n      const idx = CHART.LOG.length - 1 - ri;\n      if (p.off) return '\u003ctr class=\"ch-logrow ch-off\" data-i=\"' + idx + '\">\u003ctd>' + moon + ' ' + chLabel(p.date) + '\u003c/td>\u003ctd>' + chSetCount(p) + '\u003c/td>\u003ctd>' + chTopReps(p) + '\u003c/td>\u003ctd>' + chWD(p.kg) + ' \u003cspan class=\"u\">' + CHART.U + '\u003c/span>\u003c/td>\u003ctd class=\"prog rest\">off the line\u003c/td>\u003c/tr>';\n      const prev = chPrevReal(p.date), d = prev ? chR1(chWD(p.kg) - chWD(prev.kg)) : null, best = chBestSession(), isBest = best && p.date === best.date;\n      const prog = d == null ? '\u003ctd class=\"prog first\">first\u003c/td>' : '\u003ctd class=\"prog\">' + (d >= 0 ? '+' : '') + d + '\u003c/td>';\n      const w = isBest ? '\u003ctd>\u003cspan class=\"ch-bestw\">\u003csvg viewBox=\"0 0 24 24\">\u003cpath d=\"M12 3.5l2.5 5.1 5.6.8-4 3.9 1 5.6L12 16.9 6.9 18.9l1-5.6-4-3.9 5.6-.8z\"/>\u003c/svg>' + chWD(p.kg) + ' \u003cspan class=\"u\">' + CHART.U + '\u003c/span>\u003c/span>\u003c/td>'\n        : '\u003ctd>' + chWD(p.kg) + ' \u003cspan class=\"u\">' + CHART.U + '\u003c/span>\u003c/td>';\n      return '\u003ctr class=\"ch-logrow\" data-i=\"' + idx + '\">\u003ctd>' + chLabel(p.date) + '\u003c/td>\u003ctd>' + chSetCount(p) + '\u003c/td>\u003ctd>' + chTopReps(p) + '\u003c/td>' + w + prog + '\u003c/tr>';\n    }).join('');\n    document.getElementById('chTbody').innerHTML = rows;\n    document.querySelectorAll('#chTbody .ch-logrow').forEach(tr => tr.style.cursor = 'pointer');\n    document.querySelectorAll('#chTbody .ch-logrow').forEach(tr => tr.onclick = () => chOpenEditor(+tr.dataset.i));\n  }\n\n  // editor: add or edit a past session. Uses the same .editor styles carried over.\n  let chDraft = null, chEditIndex = null, chConfirmDel = false;\n  const chOStep = () => UNIT === 'lb' ? 5 : 2.5;\n  function chOpenEditor(index){\n    chEditIndex = index; chConfirmDel = false;\n    if (index == null){ const base = chBestSession() ? chBestSession().kg : 60; chDraft = { date: chYmd(chToday), kg: base, target: 5, sets: [{ r: 5 }, { r: 5 }, { r: 5 }], off: false }; }\n    else { const p = CHART.LOG[index]; chDraft = { date: p.date, kg: p.kg, target: chTopReps(p) || 5, sets: (p.sets || []).map(s => ({ r: s.r, fail: !!s.fail })), off: !!p.off }; }\n    chDrawEditor(); const ed = document.getElementById('chEditor'); ed.classList.add('on'); ed.scrollIntoView({ behavior: 'smooth', block: 'center' });\n  }\n  function chCloseEditor(){ const ed = document.getElementById('chEditor'); if (ed) ed.classList.remove('on'); chDraft = null; chEditIndex = null; chConfirmDel = false; }\n  function chDrawEditor(){\n    const ed = document.getElementById('chEditor'); const adding = chEditIndex == null;\n    const actions = chConfirmDel\n      ? '\u003cdiv class=\"confirm-del\">\u003cspan class=\"confirm-q\">Delete this session?\u003c/span>\u003cdiv class=\"confirm-row\">\u003cbutton class=\"obtn ghost\" id=\"chf-cancel\">Keep it\u003c/button>\u003cbutton class=\"obtn danger\" id=\"chf-yes\">Delete\u003c/button>\u003c/div>\u003c/div>'\n      : '\u003cdiv class=\"editor-actions\">' + (adding ? '' : '\u003cbutton class=\"obtn del\" id=\"chf-del\" title=\"delete\">\u003csvg viewBox=\"0 0 24 24\">\u003cpath d=\"M5 7h14M10 11v6M14 11v6M6 7l1 12h10l1-12M9 7V4h6v3\"/>\u003c/svg>\u003c/button>') + '\u003cbutton class=\"obtn save\" id=\"chf-save\">' + (adding ? 'Save session' : 'Save changes') + '\u003c/button>\u003c/div>';\n    const setBoxes = chDraft.sets.map((s, i) => '\u003cbutton class=\"eset' + (s.fail ? ' fail' : '') + '\" data-i=\"' + i + '\">' + s.r + '\u003c/button>').join('');\n    ed.innerHTML = '\u003cdiv class=\"editor-in\">\u003cdiv class=\"editor-h\">' + (adding ? 'Log a session' : 'Edit ' + chLabel(chDraft.date)) + '\u003c/div>' +\n      '\u003cdiv class=\"field\">\u003cspan class=\"lbl\">Date\u003c/span>\u003cinput type=\"date\" id=\"chf-date\" value=\"' + chDraft.date + '\" max=\"' + chYmd(chToday) + '\">\u003c/div>' +\n      '\u003cdiv class=\"field\">\u003cspan class=\"lbl\">Weight\u003c/span>\u003cdiv class=\"stepper\">\u003cbutton class=\"step minus\" data-k=\"kg\" data-d=\"-1\">&minus;\u003c/button>\u003cspan class=\"val\">\u003cinput class=\"wnum\" id=\"chf-kg\" inputmode=\"decimal\" value=\"' + chWD(chDraft.kg) + '\"> \u003csmall>' + CHART.U + '\u003c/small>\u003c/span>\u003cbutton class=\"step\" data-k=\"kg\" data-d=\"1\">+\u003c/button>\u003c/div>\u003c/div>' +\n      chStepperRow('Reps', '\u003cspan class=\"val\">' + chDraft.target + '\u003c/span>', 'reps') +\n      chStepperRow('Sets', '\u003cspan class=\"val\">' + chDraft.sets.length + '\u003c/span>', 'sets') +\n      '\u003cdiv class=\"setedit\">' + setBoxes + '\u003c/div>\u003cdiv class=\"setedit-hint\">Tap a set to lower its reps. Tap past 1 to mark it missed.\u003c/div>' +\n      '\u003cdiv class=\"resttoggle' + (chDraft.off ? ' on' : '') + '\" id=\"chf-rest\">\u003cspan class=\"pip\">\u003csvg viewBox=\"0 0 24 24\">\u003cpath d=\"M5 12l5 5L20 7\"/>\u003c/svg>\u003c/span>\u003cspan class=\"txt\">Rest or deload day\u003c/span>\u003c/div>' +\n      actions + '\u003c/div>';\n    ed.querySelector('#chf-date').onchange = e => { chDraft.date = e.target.value; };\n    const kgIn = ed.querySelector('#chf-kg');\n    if (kgIn){ kgIn.oninput = () => { const v = parseFloat(kgIn.value); if (isFinite(v) && v >= 0) chDraft.kg = chWKg(v); };\n               kgIn.onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); kgIn.blur(); } }; }\n    ed.querySelectorAll('.step').forEach(b => b.onclick = () => chBump(b.dataset.k, +b.dataset.d));\n    ed.querySelectorAll('.eset').forEach(b => b.onclick = () => chTapSet(+b.dataset.i));\n    ed.querySelector('#chf-rest').onclick = () => { chDraft.off = !chDraft.off; chDrawEditor(); };\n    if (chConfirmDel){ ed.querySelector('#chf-cancel').onclick = () => { chConfirmDel = false; chDrawEditor(); }; ed.querySelector('#chf-yes').onclick = chDeleteDraft; }\n    else { ed.querySelector('#chf-save').onclick = chSaveDraft; const del = ed.querySelector('#chf-del'); if (del) del.onclick = () => { chConfirmDel = true; chDrawEditor(); }; }\n  }\n  function chStepperRow(lbl, valHtml, key){ return '\u003cdiv class=\"field\">\u003cspan class=\"lbl\">' + lbl + '\u003c/span>\u003cdiv class=\"stepper\">\u003cbutton class=\"step minus\" data-k=\"' + key + '\" data-d=\"-1\">&minus;\u003c/button>' + valHtml + '\u003cbutton class=\"step\" data-k=\"' + key + '\" data-d=\"1\">+\u003c/button>\u003c/div>\u003c/div>'; }\n  function chBump(key, dir){\n    if (key === 'kg') chDraft.kg = Math.max(0, chWKg(chWD(chDraft.kg) + dir * chOStep()));\n    else if (key === 'reps'){ chDraft.target = Math.max(1, chDraft.target + dir); chDraft.sets = chDraft.sets.map(() => ({ r: chDraft.target })); }\n    else if (key === 'sets'){ if (dir > 0 && chDraft.sets.length \u003c 10) chDraft.sets.push({ r: chDraft.target }); else if (dir \u003c 0 && chDraft.sets.length > 1) chDraft.sets.pop(); }\n    chDrawEditor();\n  }\n  function chTapSet(i){ const s = chDraft.sets[i]; if (s.fail){ s.fail = false; s.r = chDraft.target; } else if (s.r > 1) s.r -= 1; else s.fail = true; chDrawEditor(); }\n  function chSaveDraft(){\n    const sets = chDraft.sets.map(s => s.fail ? { r: s.r, fail: true } : { r: s.r });\n    const entry = { date: chDraft.date, kg: chDraft.kg, sets };\n    if (chDraft.off) entry.off = 'deload';\n    if (chEditIndex == null) CHART.LOG.push(entry); else CHART.LOG[chEditIndex] = entry;\n    chSortLog(); chCloseEditor(); CHART.setIdx = null; chRender();\n  }\n  function chDeleteDraft(){ if (chEditIndex != null) CHART.LOG.splice(chEditIndex, 1); chCloseEditor(); CHART.setIdx = null; chRender(); }\n  // @episode-end:chart\n\n  // @episode-start:session\n  // EP4: the customizable SPLIT. The logger used to be one flat list of lifts. Now it\n  // is a split: named days, each with its own lifts. DATA holds every day; LIFTS (up in\n  // the store block) is a live reference to the ACTIVE day's lifts, so every lift\n  // function written for Episodes 1-3 keeps working untouched. This region owns the\n  // \"Today's session\" board, the day-view chrome (title + split rail), day add / rename\n  // / remove, and Settings (the kg/lb toggle and a reset). Mirrors the real Vitality\n  // product, where your split is a list of named days you build however you train.\n\n  // the active day, and (via .lifts) the array LIFTS points at\n  function activeDay(){ return DATA.days.find(d => d.id === DATA.activeDayId) || DATA.days[0]; }\n\n  // a rich starter split so the demo feels alive on first open. Push = the Episode 2\n  // seed; Pull and Legs are built from the same library catalog; Rest is empty.\n  function seedSplit(){\n    const seededPush = SEED.map(s => ({ rest:150, ...s, id: uid(), hidden:false, sets: blankSets(s.targetSets) }));\n    const libLift = (key, o) => {\n      const e = libByKey[key] || {};\n      return { name:e.name || key, tier:e.tier || 3, muscle:e.group || 'chest', libKey:key,\n        perHand: o.perHand || (e.equip === 'dumbbell'), targetSets:o.targetSets, targetReps:o.targetReps,\n        weight:o.weight, rest:150, hidden:false, history:o.history || [], id: uid(), sets: blankSets(o.targetSets) };\n    };\n    const pull = [\n      libLift('pullup_weighted', { targetSets:4, targetReps:6,  weight:15,   history:hist(0,2.5,6) }),\n      libLift('bb_row',          { targetSets:4, targetReps:8,  weight:75,   history:hist(60,2.5,8) }),\n      libLift('lat_pulldown',    { targetSets:3, targetReps:10, weight:60,   history:hist(45,2.5,10) }),\n      libLift('chest_supp_row',  { targetSets:3, targetReps:10, weight:26, perHand:true, history:hist(18,1.5,10) }),\n      libLift('bb_curl',         { targetSets:3, targetReps:10, weight:32.5, history:hist(22.5,1.5,10) }),\n      libLift('hammer_curl',     { targetSets:3, targetReps:12, weight:16, perHand:true, history:hist(10,1,12) }),\n    ];\n    const legs = [\n      libLift('back_squat',      { targetSets:4, targetReps:5,  weight:100,  history:hist(85,2.5,5) }),\n      libLift('rdl',             { targetSets:3, targetReps:8,  weight:90,   history:hist(75,2.5,8) }),\n      libLift('leg_press',       { targetSets:3, targetReps:10, weight:160,  history:hist(130,5,10) }),\n      libLift('seated_leg_curl', { targetSets:3, targetReps:12, weight:47.5, history:hist(35,2,12) }),\n      libLift('leg_ext',         { targetSets:3, targetReps:12, weight:50,   history:hist(38,2,12) }),\n      libLift('calf_raise',      { targetSets:4, targetReps:12, weight:60,   history:hist(45,2.5,12) }),\n    ];\n    const pushId = uid(), pullId = uid(), legsId = uid(), restId = uid();\n    return {\n      days: [\n        { id: pushId, name: 'Push', lifts: seededPush },\n        { id: pullId, name: 'Pull', lifts: pull },\n        { id: legsId, name: 'Legs', lifts: legs },\n        { id: restId, name: 'Rest', lifts: [] },\n      ],\n      activeDayId: pushId,\n    };\n  }\n\n  // the state of one day: empty, ready (nothing logged yet), progress, or done.\n  function dayState(day){\n    const lifts = (day.lifts || []).filter(l => !l.hidden);\n    if (!lifts.length) return { kind:'empty', logged:0, total:0, count:0 };\n    let logged = 0, total = 0;\n    lifts.forEach(l => l.sets.forEach(s => { total++; if (s.done || s.failed) logged++; }));\n    let kind = 'ready';\n    if (total > 0 && logged >= total) kind = 'done';\n    else if (logged > 0) kind = 'progress';\n    return { kind, logged, total, count: lifts.length };\n  }\n\n  // TWO VIEWS: 'board' = Today's session; 'day' = the logger. A body class flips them,\n  // so the library overlay's own .wrap-hiding rule keeps working.\n  let VIEW = 'board';\n  function showView(v){\n    VIEW = (v === 'day') ? 'day' : 'board';\n    document.body.classList.toggle('view-board', VIEW === 'board');\n    if (VIEW === 'board') renderBoard();\n    else { paintDayChrome(); liftAnimOnce = true; render(); }\n  }\n\n  // tap the big day title to rename it in place. Enter or tap-away commits,\n  // Escape cancels, an empty name keeps the old one. The .editing class stops\n  // paintDayChrome from wiping the input mid-edit.\n  function startTitleEdit(){\n    const dt = document.getElementById('dayTitle');\n    if (!dt || dt.classList.contains('editing')) return;\n    const day = activeDay();\n    const inp = document.createElement('input');\n    inp.className = 'day-title-edit';\n    inp.value = day.name; inp.maxLength = 40;\n    inp.autocomplete = 'off'; inp.spellcheck = false; inp.setAttribute('aria-label', 'Day name');\n    dt.classList.add('editing');\n    dt.innerHTML = ''; dt.appendChild(inp);\n    inp.focus(); inp.select();\n    let done = false;\n    const commit = keep => {\n      if (done) return; done = true;\n      const v = keep ? inp.value.trim() : '';\n      if (v && v !== day.name){ day.name = v; saveLog(); }\n      dt.classList.remove('editing');\n      paintDayChrome();\n    };\n    inp.onblur = () => commit(true);\n    inp.onkeydown = e => {\n      if (e.key === 'Enter'){ e.preventDefault(); inp.blur(); }\n      else if (e.key === 'Escape'){ e.preventDefault(); commit(false); }\n    };\n  }\n\n  // switch the active day: repoint LIFTS at its lifts, save, repaint chrome + list.\n  function switchDay(id){\n    const d = DATA.days.find(x => x.id === id); if (!d) return;\n    DATA.activeDayId = id;\n    LIFTS = activeDay().lifts;\n    saveLog();\n    if (typeof rcDismiss === 'function') rcDismiss();   // the rest coach was for the old day\n    paintDayChrome();\n    render();\n  }\n\n  // day-view chrome: the big day title + the split rail (one segment per day). Built\n  // from DATA.days each time, so it always matches the day count and names.\n  function paintDayChrome(){\n    const dt = document.getElementById('dayTitle');\n    if (dt && !dt.classList.contains('editing')){\n      dt.innerHTML = '\u003cspan class=\"day-name\">' + esc(activeDay().name) + '\u003c/span>' +\n        '\u003cspan class=\"pen\" aria-hidden=\"true\">' + SVG('\u003cpath d=\"M17 3l4 4L8 20l-5 1 1-5z\"/>') + '\u003c/span>';\n      dt.onclick = startTitleEdit;\n      dt.title = 'Tap to rename this day';\n    }\n    const rail = document.getElementById('splitRail');\n    if (!rail) return;\n    rail.innerHTML = DATA.days.map(d => {\n      const st = dayState(d);\n      const cls = 'rail-seg' + (d.id === DATA.activeDayId ? ' active' : '') + (st.kind === 'done' ? ' done' : '') + (st.kind === 'empty' ? ' empty' : '');\n      return '\u003cbutton class=\"' + cls + '\" data-id=\"' + d.id + '\">\u003cspan class=\"rail-bar\">\u003c/span>\u003cspan class=\"rail-name\">' + esc(d.name) + '\u003c/span>\u003c/button>';\n    }).join('');\n    rail.querySelectorAll('.rail-seg').forEach(s => s.onclick = () => { switchDay(s.dataset.id); showView('day'); });\n  }\n\n  // THE BOARD. A tile per day: index, serif name, a live state line, its exercise count,\n  // a progress bar mid-session, a check when done. Plus an \"Add a day\" affordance.\n  function renderBoard(){\n    const board = document.getElementById('board'); if (!board) return;\n    const tiles = DATA.days.map((day, i) => {\n      const st = dayState(day);\n      const idx = '&middot;' + String(i + 1).padStart(2, '0');\n      let line, bar = '', check = '';\n      if (st.kind === 'empty') line = 'empty &nbsp;&middot;&nbsp; tap to add lifts';\n      else if (st.kind === 'done'){ line = 'done'; check = '\u003cspan class=\"board-check\">' + SVG('\u003cpath d=\"M4 12l5 5L20 6\"/>') + '\u003c/span>'; }\n      else if (st.kind === 'progress'){ line = st.logged + ' of ' + st.total + ' logged'; bar = '\u003cdiv class=\"board-bar\">\u003cspan style=\"width:' + Math.round(st.logged / st.total * 100) + '%\">\u003c/span>\u003c/div>'; }\n      else line = 'tap to start';\n      const meta = st.kind === 'empty' ? '' : '\u003cspan class=\"board-meta\">' + st.count + ' exercise' + (st.count > 1 ? 's' : '') + '\u003c/span>';\n      return '\u003cdiv class=\"board-tile\" data-id=\"' + day.id + '\" style=\"animation-delay:' + (i * 55) + 'ms\">' +\n          '\u003cbutton class=\"board-menu\" data-menu=\"' + day.id + '\" aria-label=\"Day options\">' + SVG('\u003ccircle cx=\"5\" cy=\"12\" r=\"1.7\"/>\u003ccircle cx=\"12\" cy=\"12\" r=\"1.7\"/>\u003ccircle cx=\"19\" cy=\"12\" r=\"1.7\"/>') + '\u003c/button>' +\n          '\u003cspan class=\"board-idx\">' + idx + '\u003c/span>' +\n          '\u003cspan class=\"board-name\">' + esc(day.name) + '\u003c/span>' +\n          '\u003cspan class=\"board-state' + (st.kind === 'done' ? ' done' : '') + '\">' + check + '\u003cspan>' + line + '\u003c/span>\u003c/span>' +\n          meta + bar +\n        '\u003c/div>';\n    }).join('');\n    const addTile = '\u003cbutton class=\"board-add\" id=\"boardAdd\" style=\"animation-delay:' + (DATA.days.length * 55) + 'ms\">' + SVG('\u003cpath d=\"M12 5v14M5 12h14\"/>') + '\u003cspan>Add a day\u003c/span>\u003c/button>';\n    board.innerHTML =\n      '\u003cdiv class=\"board-head\">\u003ch1 class=\"board-h1\">Today&rsquo;s session\u003c/h1>' +\n        '\u003cp class=\"board-sub\">Your split. Build it however you train.\u003c/p>\u003c/div>' +\n      '\u003cdiv class=\"board-grid\">' + tiles + addTile + '\u003c/div>';\n    board.querySelectorAll('.board-tile').forEach(t => {\n      t.onclick = e => { if (e.target.closest('.board-menu')) return; switchDay(t.dataset.id); showView('day'); };\n    });\n    board.querySelectorAll('.board-menu').forEach(b => b.onclick = e => { e.stopPropagation(); openDayMenu(b.dataset.menu); });\n    const add = document.getElementById('boardAdd'); if (add) add.onclick = addDay;\n  }\n\n  // add a new empty day, switch to it, and open the library right away: naming\n  // can wait (tap the title any time), picking lifts is the actual job.\n  function addDay(){\n    // the official naming moment: a day is born with a real name, not \"Day 5\"\n    openSheet(\n      '\u003cdiv class=\"sheet-eyebrow\">New day\u003c/div>' +\n      '\u003cdiv class=\"sheet-title\">Name your day\u003c/div>' +\n      '\u003cdiv class=\"sheet-sub\">Tap a name or type your own. You can rename it any time.\u003c/div>' +\n      '\u003cdiv class=\"day-quick\">' +\n        ['Push','Pull','Legs','Upper','Lower','Full body','Arms','Rest'].map(function(n){\n          return '\u003cbutton class=\"day-chip\" data-n=\"' + n + '\">' + n + '\u003c/button>';\n        }).join('') +\n      '\u003c/div>' +\n      '\u003cinput class=\"add-input\" id=\"dayNew\" placeholder=\"Or type a name\" maxlength=\"40\" autocomplete=\"off\">' +\n      '\u003cdiv class=\"card-foot\">\u003cbutton class=\"btn-mint\" id=\"dayCreate\">Create the day\u003c/button>\u003c/div>'\n    );\n    const inp = sheet.querySelector('#dayNew');\n    const create = (name) => {\n      const nm = (name || inp.value.trim() || ('Day ' + (DATA.days.length + 1)));\n      const id = uid();\n      DATA.days.push({ id, name: nm, lifts: [] });\n      DATA.activeDayId = id;\n      LIFTS = activeDay().lifts;\n      saveLog(); closeSheet(); paintDayChrome(); render();\n      showView('day');\n      setTimeout(openLibrary, 240);   // let the day view land, then slide the library in\n    };\n    sheet.querySelectorAll('.day-chip').forEach(c => { c.onclick = () => create(c.dataset.n); });\n    sheet.querySelector('#dayCreate').onclick = () => create();\n    inp.onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); create(); } };\n    try { inp.focus(); } catch(e){}\n  }\n\n  // the tile \"...\" menu: rename inline, or remove the day (never the last one).\n  function openDayMenu(id){\n    const day = DATA.days.find(d => d.id === id); if (!day) return;\n    openSheet(\n      '\u003cdiv class=\"sheet-eyebrow\">Day\u003c/div>' +\n      '\u003cdiv class=\"sheet-title\">' + esc(day.name) + '\u003c/div>' +\n      '\u003cdiv class=\"day-menu\">' +\n        '\u003cspan class=\"day-menu-lab\">Rename\u003c/span>' +\n        '\u003cinput class=\"add-input\" id=\"dayRename\" value=\"' + esc(day.name) + '\" maxlength=\"40\" autocomplete=\"off\">' +\n        '\u003cdiv class=\"card-foot\">' +\n          (DATA.days.length > 1 ? '\u003cbutton class=\"btn-ghost\" id=\"dayRemove\">Remove day\u003c/button>' : '') +\n          '\u003cbutton class=\"btn-mint\" id=\"daySave\">Save\u003c/button>' +\n        '\u003c/div>' +\n      '\u003c/div>'\n    );\n    const inp = sheet.querySelector('#dayRename');\n    const save = () => { const v = inp.value.trim(); if (v){ day.name = v; saveLog(); } closeSheet(); paintDayChrome(); renderBoard(); };\n    sheet.querySelector('#daySave').onclick = save;\n    inp.onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); save(); } };\n    const rm = sheet.querySelector('#dayRemove');\n    if (rm){\n      let armed = false;\n      rm.onclick = () => {\n        if (!armed){ armed = true; rm.textContent = 'Tap again to remove'; rm.classList.add('danger-ghost'); return; }\n        removeDay(id);\n      };\n    }\n    try { inp.focus(); } catch(e){}\n  }\n  function removeDay(id){\n    if (DATA.days.length \u003c= 1) return;                     // never remove the last day\n    const wasActive = DATA.activeDayId === id;\n    DATA.days = DATA.days.filter(d => d.id !== id);\n    if (wasActive){ DATA.activeDayId = DATA.days[0].id; LIFTS = activeDay().lifts; }\n    saveLog();\n    closeSheet();\n    paintDayChrome();\n    renderBoard();\n  }\n\n  // SETTINGS. Holds the kg/lb toggle (moved off the top bar) and reset-everything.\n  function openSettings(){\n    openSheet(\n      '\u003cdiv class=\"sheet-eyebrow\">Settings\u003c/div>' +\n      '\u003cdiv class=\"sheet-title\">Your preferences\u003c/div>' +\n      '\u003cdiv class=\"set-group\">' +\n        '\u003cdiv class=\"set-row\">\u003cspan class=\"set-lab\">\u003cspan class=\"set-k\">Units\u003c/span>' +\n          '\u003cspan class=\"set-cap\">Storage stays in kg. Toggle changes display only.\u003c/span>\u003c/span>' +\n          '\u003cspan class=\"unit-toggle\" id=\"setUnit\">\u003cbutton class=\"unit-opt\" data-u=\"kg\" type=\"button\">kg\u003c/button>' +\n          '\u003cbutton class=\"unit-opt\" data-u=\"lb\" type=\"button\">lbs\u003c/button>\u003c/span>\u003c/div>' +\n      '\u003c/div>' +\n      '\u003cdiv class=\"set-danger\">\u003cbutton class=\"set-reset\" id=\"setReset\">' +\n        '\u003cspan class=\"set-reset-t\">Reset everything\u003c/span>' +\n        '\u003cspan class=\"set-reset-s\">Wipes your split and history on this device. Cannot be undone.\u003c/span>' +\n      '\u003c/button>\u003c/div>'\n    );\n    paintUnitToggle();\n    sheet.querySelectorAll('#setUnit .unit-opt').forEach(b => b.onclick = () => setUnit(b.dataset.u));\n    const rb = sheet.querySelector('#setReset');\n    let armed = false;\n    rb.onclick = () => {\n      if (!armed){ armed = true; rb.classList.add('armed'); rb.querySelector('.set-reset-t').textContent = 'Tap again to reset everything'; return; }\n      resetEverything();\n    };\n  }\n  function resetEverything(){\n    try {\n      localStorage.removeItem(STORE);\n      localStorage.removeItem(STORE2);\n      localStorage.removeItem('vitality.logger.unit');\n      Object.keys(localStorage).filter(k => k.indexOf('vitality.overload.') === 0).forEach(k => localStorage.removeItem(k));\n    } catch(e){}\n    UNIT = 'kg';\n    // Full circle: a reset returns to the first-run chooser, NEVER to seeded\n    // data. Same behavior in the demo, the dashboard tile, and their own app.\n    const id = uid();\n    DATA = { days:[{ id, name:'Day 1', lifts:[] }], activeDayId:id };\n    LIFTS = activeDay().lifts;\n    saveLog();\n    if (typeof rcDismiss === 'function') rcDismiss();\n    closeSheet();\n    render();\n    showView('board');\n    openSetup();\n  }\n  // @episode-end:session\n\n  // @episode-start:logger\n  // bottom actions + boot\n  document.getElementById('libOpen').onclick = openLibrary;\n  document.getElementById('reorderBtn').onclick = openReorder;\n\n  // snowy particles drifting behind everything\n  (function snow(){\n    const cv = document.getElementById('snow'); if (!cv) return;\n    const ctx = cv.getContext('2d');\n    let W, H, parts;\n    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;\n    const mk = () => ({ x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.5+0.4, s:Math.random()*0.35+0.08, d:Math.random()*0.3-0.15, o:Math.random()*0.4+0.12 });\n    function size(){ W=cv.width=innerWidth; H=cv.height=innerHeight; parts=Array.from({length: reduce?26:54}, mk); }\n    function frame(){\n      ctx.clearRect(0,0,W,H);\n      for (const p of parts){\n        p.y += p.s; p.x += p.d;\n        if (p.y > H+2){ p.y = -2; p.x = Math.random()*W; }\n        if (p.x \u003c -2) p.x = W; if (p.x > W+2) p.x = 0;\n        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.3);\n        ctx.fillStyle = 'rgba(167,243,208,' + p.o + ')'; ctx.fill();\n      }\n      if (!reduce) requestAnimationFrame(frame);\n    }\n    size(); addEventListener('resize', size); frame();\n  })();\n\n  celebratedPrev = currentCelebrating();\n  render();\n  // @episode-end:logger\n\n  // @episode-start:session\n  // wire the day-view chrome, then open on the Today's session board (the video opens here).\n  document.getElementById('dayBack').onclick = () => showView('board');\n  document.getElementById('settingsBtn').onclick = openSettings;\n  showView('board');\n  // First open, nothing saved: they build THEIR split before they see a board.\n  // Show the first-run chooser for any account that has no lifts yet and has not finished setup\n  // (covers brand-new users AND accounts whose empty Day 1 was already synced before they picked).\n  const needsSetup = () => DATA && !DATA.setupDone && !DATA.days.some(d => d.lifts && d.lifts.length);\n  if (FRESH_START || needsSetup()) openSetup();\n  // The demo wears a tag so nobody ever mistakes example data for the product.\n  if (DEMO_MODE){\n    const tag = document.createElement('div');\n    tag.style.cssText = 'position:fixed;top:12px;right:12px;z-index:300;font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#F59E0B;border:1px solid rgba(245,158,11,.4);border-radius:999px;padding:6px 11px;background:rgba(0,0,0,.6);pointer-events:none';\n    tag.textContent = 'Demo data \u00b7 yours starts clean';\n    document.body.appendChild(tag);\n  }\n  // @episode-end:session\n\u003c/script>\n\n\u003cstyle>\n  /* editor styles shared by the chart's \"log a session\" panel (mapped to tokens) */\n  .editor{overflow:hidden;max-height:0;opacity:0;transition:max-height .35s var(--spring),opacity .25s,margin .35s}\n  .editor.on{max-height:820px;opacity:1;margin-top:18px}\n  .editor-in{border:1px solid var(--rule-strong);border-radius:16px;padding:18px;background:rgba(255,255,255,.03)}\n  .editor-h{font-size:16px;font-weight:600}\n  .field{display:flex;align-items:center;justify-content:space-between;margin-top:16px}\n  .field .lbl{color:var(--muted);font-size:14px;font-weight:500}\n  .stepper{display:flex;align-items:center;gap:13px}\n  .step{width:36px;height:36px;border-radius:10px;border:1px solid var(--rule-strong);background:var(--bg);color:var(--fg);font-size:21px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .18s var(--spring),border-color .2s;font-family:var(--sans)}\n  .step:hover{border-color:var(--mint)} .step:active{transform:scale(.9)} .step.minus{color:var(--muted)}\n  .val{min-width:88px;text-align:center;font-size:18px;font-weight:700} .val small{font-size:11px;font-weight:500;color:var(--muted)}\n  .field input[type=date]{background:var(--bg);border:1px solid var(--rule-strong);color:var(--fg);font-family:var(--sans);font-size:14px;font-weight:500;padding:9px 12px;border-radius:10px;color-scheme:dark}\n  .wnum{background:none;border:none;color:inherit;font:inherit;font-weight:inherit;width:auto;field-sizing:content;min-width:1.6ch;max-width:6ch;text-align:center;outline:none;border-bottom:1.5px solid transparent;padding:0 1px;transition:border-color .18s,color .18s}\n  .wnum:focus{color:var(--mint);border-bottom-color:var(--mint)}\n  .setedit{display:flex;flex-wrap:wrap;gap:9px;margin-top:16px}\n  .eset{width:42px;height:42px;border:1px solid var(--gold);border-radius:10px;background:rgba(241,207,122,.06);color:var(--gold);font-weight:600;font-size:16px;font-family:var(--sans);font-variant-numeric:tabular-nums;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s var(--spring),border-color .18s}\n  .eset:hover{border-color:var(--mint)} .eset:active{transform:scale(.88)}\n  .eset.fail{border-color:var(--rose);color:var(--rose);text-decoration:line-through;text-decoration-thickness:2px;background:rgba(224,118,123,.08)}\n  .setedit-hint{color:var(--muted);font-size:12px;margin-top:9px}\n  .resttoggle{display:flex;align-items:center;gap:9px;margin-top:16px;padding:12px 13px;border:1px solid var(--rule);border-radius:12px;cursor:pointer;transition:border-color .2s,background .2s}\n  .resttoggle.on{border-color:var(--muted);background:rgba(255,255,255,.04)}\n  .resttoggle .pip{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--rule-strong);flex:none;display:flex;align-items:center;justify-content:center}\n  .resttoggle.on .pip{background:var(--muted);border-color:var(--muted)}\n  .resttoggle .pip svg{width:12px;height:12px;fill:none;stroke:var(--bg);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;opacity:0}\n  .resttoggle.on .pip svg{opacity:1}\n  .resttoggle .txt{font-size:13.5px;font-weight:500}\n  .editor-actions{display:flex;gap:10px;margin-top:20px}\n  .obtn{flex:1;border:none;border-radius:12px;padding:13px;font-family:var(--sans);font-size:14.5px;font-weight:600;cursor:pointer;transition:transform .18s var(--spring)}\n  .obtn:active{transform:scale(.98)}\n  .obtn.save{background:var(--mint);color:var(--mint-ink)}\n  .obtn.del{flex:none;width:50px;background:none;border:1px solid var(--rule-strong);color:var(--muted)}\n  .obtn.del:hover{border-color:var(--rose);color:var(--rose)}\n  .obtn.del svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round}\n  .obtn.ghost{background:none;border:1px solid var(--rule-strong);color:var(--muted)}\n  .obtn.ghost:hover{color:var(--fg);border-color:var(--muted)}\n  .obtn.danger{background:rgba(224,118,123,.12);border:1px solid var(--rose);color:#e88a8c}\n  .logbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:24px;border:1.5px dashed var(--rule-strong);border-radius:14px;padding:15px;background:none;color:var(--mint);font-family:var(--sans);font-size:14.5px;font-weight:500;cursor:pointer;transition:border-color .2s,transform .2s var(--spring)}\n  .logbtn:hover{border-color:var(--mint)} .logbtn:active{transform:scale(.99)}\n  .confirm-del{margin-top:20px} .confirm-q{display:block;text-align:center;font-size:14px;font-weight:500;color:var(--fg);margin-bottom:12px} .confirm-row{display:flex;gap:10px}\n/* ---- design-kit alignment (matches Fuel) ---- */\n:root{--card:rgba(255,255,255,.02);--rule:rgba(255,255,255,.08);}\n.pill,.su-card,.po-show,.po-confirm,.po-choice,.fr-tierCard,.lib-search,.ro-row,.ch-sheet,.ch-plotcard,.ch-next,.day-empty,.editor-in,.logbtn{border-radius:12px}\n.btn-mint,.btn-ghost{border-radius:8px}.btn-mint{color:var(--mint-ink)}\n/* ---- design-kit finishing touches (globals.css) ---- */\nhtml{background:#04060a;overscroll-behavior-y:none}\nbody{text-rendering:optimizeLegibility;-moz-osx-font-smoothing:grayscale;accent-color:var(--mint);-webkit-user-select:none;-moz-user-select:none;user-select:none}\ninput,textarea,select,[contenteditable],.selectable,.selectable *{-webkit-user-select:text;-moz-user-select:text;user-select:text;caret-color:var(--mint)}\n::selection{background:rgba(var(--acc-rgb),.25)}\n:focus-visible{outline:2px solid rgba(var(--acc-rgb),.65);outline-offset:2px}input:focus-visible,select:focus-visible{outline:none}\nbutton{font-family:inherit}\nbody::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.035;background-image:url(\"data:image/svg+xml;utf8,\u003csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'>\u003cfilter id='n'>\u003cfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/>\u003c/filter>\u003crect width='100%25' height='100%25' filter='url(%23n)'/>\u003c/svg>\");background-size:200px 200px}\n.home-link{display:inline-block;font:10.5px var(--mono,'JetBrains Mono',monospace);letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.5);text-decoration:none;margin:0 0 14px}.home-link:hover{color:var(--mint)}\n\u003c/style>\n\n\n\u003cscript>\n(function(){\n  // ===== CONFIG: paste your two values from Supabase > Project Settings > API =====\n  var SUPABASE_URL = '';\n  var SUPABASE_ANON_KEY = '';   // the public \"anon\" key ONLY. Never the service_role key.\n  // ================================================================================\n  var K_DATA='vitality.logger.v4', K_OLD='vitality.logger.v3', K_UNIT='vitality.logger.unit';\n  function bootApp(){ var s=document.createElement('script'); s.textContent=document.getElementById('app-src').textContent; document.body.appendChild(s);ready()}\n  function ready(){requestAnimationFrame(function(){requestAnimationFrame(function(){document.documentElement.classList.remove(\"booting\");var q=document.getElementById(\"splash\");if(q)q.remove()})})}\n  var configured = /^https?:\\/\\//.test(SUPABASE_URL) && SUPABASE_ANON_KEY.length > 20;\n  if(!configured || !window.supabase){ bootApp(); return; }   // not configured / offline first load: run local-only\n\n  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);\n  var uid=null, email='', timer=null, canPush=false, booted=false;\n\n  function readLocal(){ var d=null,u=null; try{d=JSON.parse(localStorage.getItem(K_DATA));}catch(e){} try{u=localStorage.getItem(K_UNIT);}catch(e){} return {data:d, unit:u}; }\n  function hasLifts(d){ return !!(d && Array.isArray(d.days) && d.days.some(function(x){ return x.lifts && x.lifts.length; })); }\n  function clearLocal(){ try{ localStorage.removeItem(K_DATA); localStorage.removeItem(K_OLD); localStorage.removeItem(K_UNIT);\n    Object.keys(localStorage).filter(function(k){return k.indexOf('vitality.overload.')===0;}).forEach(function(k){localStorage.removeItem(k);}); }catch(e){} }\n\n  function setStatus(t){ var el=document.getElementById('cb-status'); if(el) el.textContent=t; }\n  asyn lor:var(--mint);font:inherit;cursor:pointer;padding:0}';\n  var st=document.createElement('style'); st.textContent=css; document.head.appendChild(st);\n\n  function showLogin(){\n    var o=document.createElement('div'); o.id='lg';\n    o.innerHTML='\u003cdiv class=\"box\">\u003ch1>The Living Logger\u003c/h1>\u003cp id=\"lgMsg\">Enter your email. We\\'ll send you a sign-in code. No password needed.\u003c/p>'+\n      '\u003cinput id=\"lgEmail\" type=\"email\" inputmode=\"email\" autocomplete=\"email\" placeholder=\"you@email.com\">'+\n      '\u003cinput id=\"lgCode\" type=\"text\" inputmode=\"numeric\" autocomplete=\"one-time-code\" placeholder=\"Code from your email\" style=\"display:none\">'+\n      '\u003cbutton id=\"lgGo\">Send code\u003c/button>\u003cdiv class=\"err\" id=\"lgErr\">\u003c/div>\u003cbutton class=\"lnk\" id=\"lgBack\" style=\"display:none\">Use a different email\u003c/button>\u003c/div>';\n    document.body.appendChild(o);\n    var stage='email', em=o.querySelector('#lgEmail'), cd=o.querySelector('#lgCode'), go=o.querySelector('#lgGo'), er=o.querySelector('#lgErr'), bk=o.querySelector('#lgBack'), msg=o.querySelector('#lgMsg');\n    function err(t){ er.textContent=t||''; }\n    go.onclick=async function(){\n      err(''); go.disabled=true;\n      try{\n        if(stage==='email'){\n          email=em.value.trim().toLowerCase(); if(!email){ err('Enter your email.'); return; }\n          var r=await sb.auth.signInWithOtp({ email:email, options:{ shouldCreateUser:true } });\n          if(r.error) throw r.error;\n          stage='code'; em.style.display='none'; cd.style.display='block'; bk.style.display='block'; go.textContent='Sign in'; cd.focus();\n          msg.textContent='Check '+email+' for your code (or tap the link in the email). Enter the code below.';\n        } else {\n          var c=cd.value.replace(/\\s+/g,''); if(!c){ err('Enter the code.'); return; }\n          var v=await sb.auth.verifyOtp({ email:email, token:c, type:'email' });\n          if(v.error) throw v.error;\n          o.remove(); start(v.data.session);\n        }\n      }catch(e){ err(e.message||'Something went wrong. Try again.'); }\n      finally{ go.disabled=false; }\n    };\n    bk.onclick=function(){ stage='email'; cd.style.display='none'; em.style.display='block'; bk.style.display='none'; go.textContent='Send code'; msg.textContent='Enter your email. We\\'ll send you a sign-in code. No password needed.'; err(''); };\n    em.addEventListener('keydown',function(e){ if(e.key==='Enter') go.click(); });\n    cd.addEventListener('keydown',function(e){ if(e.key==='Enter') go.click(); });\n  }\n\n  async function start(session){\n    if(booted) return; booted=true;\n    uid=session.user.id; email=session.user.email||email;\n    try{\n      var r=await sb.from('user_data').select('data').eq('user_id',uid).maybeSingle();\n      if(r.error) throw r.error;\n      var remote=r.data && r.data.data;\n      if(remote && remote.data){\n        localStorage.setItem(K_DATA, JSON.stringify(remote.data));\n        if(remote.unit) localStorage.setItem(K_UNIT, remote.unit); else localStorage.removeItem(K_UNIT);\n        localStorage.removeItem(K_OLD);\n      } else if(!hasLifts(readLocal().data)){ clearLocal(); }   // brand-new account: start clean, never inherit another person's data\n      canPush=true;                                             // pull succeeded (or account is new), safe to sync up\n    }catch(e){ canPush=false; }                                 // couldn't reach the database: use local cache, never overwrite the cloud copy\n    bootApp();\n    var bar=document.createElement('div'); bar.id='cloudbar';\n    bar.innerHTML='\u003cspan>'+email+'\u003c/span>\u003cspan id=\"cb-status\">'+(canPush?'\u25cf synced':'\u25cf offline, using saved copy')+'\u003c/span>\u003cbutton id=\"cb-out\">Sign out\u003c/button>';\n    document.body.appendChild(bar);\n    document.getElementById('cb-out').onclick=async function(){ clearTimeout(timer); await pu
