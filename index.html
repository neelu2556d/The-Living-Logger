ry { localStorage.setItem('vitality.logger.unit', u); } catch(e){} if (window.__cloudSave) window.__cloudSave(); paintUnitToggle(); render(); }\n\n  loadLog();\n\n  // \u2500\u2500 first-run setup: nobody inherits anyone's split. They pick, blank, theirs. \u2500\u2500\n  const SPLIT_TEMPLATES = [\n    { key:'ppl', name:'Push \u00b7 Pull \u00b7 Legs', line:'The classic. Three training days and a rest day, balanced across everything.',\n      days:[ ['Push',['bench_bb','incl_db_press','standing_ohp','db_lat_raise','tri_pushdown']],\n             ['Pull',['pullup','bb_row','lat_pulldown','face_pull','bb_curl']],\n             ['Legs',['back_squat','rdl','leg_press','lying_leg_curl','calf_raise']],\n             ['Rest',[]] ] },\n    { key:'ul', name:'Upper \u00b7 Lower', line:'Four lifts and up per day, two halves of the body, simple to run all year.',\n      days:[ ['Upper',['bench_bb','bb_row','standing_ohp','lat_pulldown','bb_curl','tri_pushdown']],\n             ['Lower',['back_squat','rdl','leg_press','lying_leg_curl','calf_raise']],\n             ['Rest',[]] ] },\n    { key:'full', name:'Full body', line:'Everything each visit. Perfect for two or three gym days a week.',\n      days:[ ['Full body A',['back_squat','bench_bb','bb_row','plank']],\n             ['Full body B',['rdl','standing_ohp','lat_pulldown','walking_lunge']],\n             ['Rest',[]] ] },\n  ];\n  function freshLift(key){\n    const e = libByKey[key]; if (!e) return null;\n    const d = tierDefaults(e.tier);\n    return { name:e.name, tier:e.tier, muscle:e.group, libKey:e.key, perHand:e.equip === 'dumbbell',\n      targetSets:d.targetSets, targetReps:d.targetReps, weight:d.weight, rest:150, hidden:false,\n      history:[], id:uid(), sets:blankSets(d.targetSets) };\n  }\n  function applyTemplate(tpl){\n    const days = tpl.days.map(([name, keys]) => ({ id:uid(), name, lifts: keys.map(freshLift).filter(Boolean) }));\n    DATA.days = days; DATA.activeDayId = days[0].id; LIFTS = activeDay().lifts; saveLog();\n  }\n  function openSetup(){\n    const veil = document.createElement('div');\n    veil.className = 'su-veil';\n    veil.innerHTML =\n      '\u003cdiv class=\"su-wrap\">' +\n        '\u003cdiv class=\"su-eyebrow\">First time \u00b7 make it yours\u003c/div>' +\n        '\u003ch1 class=\"su-title\">Your split, your numbers.\u003c/h1>' +\n        '\u003cp class=\"su-sub\">Pick a starting shape. Every lift starts blank, so your history begins at your first set. Swap anything later.\u003c/p>' +\n        '\u003cdiv class=\"su-grid\">' +\n          SPLIT_TEMPLATES.map(t =>\n            '\u003cdiv class=\"su-card\" data-k=\"' + t.key + '\">' +\n              '\u003cdiv class=\"su-name\">' + t.name + '\u003c/div>' +\n              '\u003cdiv class=\"su-line\">' + t.line + '\u003c/div>' +\n              '\u003cdiv class=\"su-days\">' + t.days.map(d => '\u003cspan class=\"su-day\">' + d[0] + '\u003c/span>').join('') + '\u003c/div>' +\n            '\u003c/div>').join('') +\n        '\u003c/div>' +\n        '\u003cdiv class=\"su-units\">\u003cbutton type=\"button\" class=\"su-unit on\" data-u=\"kg\">kg\u003c/button>\u003cbutton type=\"button\" class=\"su-unit\" data-u=\"lb\">lb\u003c/button>\u003c/div>' +\n        '\u003cbutton type=\"button\" class=\"su-ghost\">Start empty, I will build my own\u003c/button>' +\n      '\u003c/div>';\n    document.body.appendChild(veil);\n    let pickedUnit = 'kg';\n    veil.querySelectorAll('.su-unit').forEach(b => b.addEventListener('click', function(){\n      pickedUnit = b.dataset.u;\n      veil.querySelectorAll('.su-unit').forEach(x => x.classList.toggle('on', x === b));\n    }));\n    function close(){\n      setUnit(pickedUnit);\n      DATA.setupDone = true; saveLog();\n      veil.classList.add('off');\n      setTimeout(() => veil.remove(), 500);\n      renderBoard(); render();\n    }\n    veil.querySelectorAll('.su-card').forEach(c => c.addEventListener('click', function(){\n      const tpl = SPLIT_TEMPLATES.find(t => t.key === c.dataset.k);\n      if (tpl) applyTemplate(tpl);\n      close();\n    }));\n    veil.querySelector('.su-ghost').addEventListener('click', close);\n  }\n\n  const listEl = document.getElementById('list');\n  const hiddenEl = document.getElementById('hidden');\n\n  // The whole point: grade a set the instant it is logged. Beat the target and it\n  // turns mint. Hit it exactly, still mint. Fall short on reps and it is a calm\n  // amber, never a failure. A tapped \"miss\" is rose.\n  function gradeSet(lift, set){\n    if (set.failed) return 'failed';\n    if (!set.done) return 'empty';\n    const beatWeight = set.weight > lift.weight;\n    const beatReps   = set.reps   > lift.targetReps;\n    const metWeight  = set.weight >= lift.weight;\n    const metReps    = set.reps   >= lift.targetReps;\n    if (metWeight && metReps) return (beatWeight || beatReps) ? 'over' : 'clean';\n    return 'partial';\n  }\n  function statusWord(lift, set, kind){\n    if (kind === 'failed') return 'missed';\n    if (kind === 'over'){ const d = set.reps - lift.targetReps; return d > 0 ? 'done \u00b7 +' + d : 'done'; }\n    if (kind === 'partial'){ const d = set.reps - lift.targetReps; return d \u003c 0 ? 'partial \u00b7 ' + d : 'partial'; }\n    return 'done';\n  }\n\n  // One honest number across the visible lifts: how many sets are logged out of\n  // how many you set out to do. A miss still counts. Hidden lifts never count.\n  function progress(){\n    let logged = 0, total = 0;\n    LIFTS.filter(l => !l.hidden).forEach(l => {\n      l.sets.forEach(s => { total++; if (s.done || s.failed) logged++; });\n    });\n    return { logged, total };\n  }\n  function paintProgress(){\n    const { logged, total } = progress();\n    document.getElementById('fill').style.width = total ? (logged/total*100) + '%' : '0%';\n    // an empty day says so plainly instead of \"0 of 0 logged\"\n    document.getElementById('count').innerHTML = total\n      ? '\u003cb>' + logged + '\u003c/b> of ' + total + ' logged'\n      : 'no lifts yet';\n  }\n\n  // render\n  function render(){\n    listEl.innerHTML = '';\n    const visible = LIFTS.filter(l => !l.hidden);\n    visible.forEach((lift, i) => {\n      const el = liftCard(lift);\n      if (liftAnimOnce) el.style.setProperty('--i', Math.min(i, 8));\n      else { el.style.animation = 'none'; el.style.opacity = '1'; el.style.transform = 'none'; }\n      listEl.appendChild(el);\n    });\n    liftAnimOnce = false;\n    // an empty day gets one inviting card that leads straight to the library\n    if (!visible.length){\n      const empty = document.createElement('div');\n      empty.className = 'day-empty';\n      empty.innerHTML =\n        '\u003cdiv class=\"day-empty-t\">Build this day\u003c/div>' +\n        '\u003cdiv class=\"day-empty-s\">Pick your lifts from the library. Tap a move to add it, close the library when the day looks right.\u003c/div>' +\n        '\u003cbutton class=\"day-empty-btn\" type=\"button\">' + SVG('\u003cpath d=\"M12 5v14M5 12h14\"/>') + ' Add from the library\u003c/button>';\n      empty.querySelector('.day-empty-btn').onclick = openLibrary;\n      listEl.appendChild(empty);\n    }\n    renderHidden();\n    paintProgress();\n    paintFinish();\n    syncCelebrations();\n    if (typeof paintDayChrome === 'function') paintDayChrome();   // session: keep the day title + split rail in sync\n  }\n\n  function liftCard(lift){\n    const el = document.createElement('div');\n    const conquered = isConquered(lift);\n    el.className = 'lift' + (conquered ? ' conquered' : '') + (celebratingIds.has(lift.id) ? ' celebrate' : '');\n    el.dataset.id = lift.id;\n    const unit = uLabel(lift.perHand);\n    const anyLogged = lift.sets.some(s => s.done || s.failed);\n    const bump = lift.overload || null;\n    const armed = !!bump && ((bump.weightKg || 0) > 0 || (bump.reps || 0) > 0);\n    const goalMet = overloadGoalMet(lift);\n    const starCls = 'starPill' +\n      (armed && !goalMet ? ' starPillArmed' : '') +\n      (goalMet ? ' starPillDone' : '') +\n      (anyLogged && !goalMet ? ' starPillInert' : '');\n    const starAmt = armed && !goalMet ? bumpLabel(bump, lift.perHand) : '';\n    el.innerHTML =\n      '\u003cdiv class=\"lift-head\">' +\n        '\u003cspan class=\"glyph\" aria-hidden=\"true\">' + SVG(GLYPH[lift.muscle] || GLYPH.chest) + '\u003c/span>' +\n        '\u003cspan class=\"lift-name\">' + esc(lift.name) + '\u003c/span>' +\n        '\u003cspan class=\"info\" title=\"About this lift\">i\u003c/span>' +\n        (conquered ? '\u003cspan class=\"conqueredStar\" title=\"Progressive overload conquered\">' + SVG(ICON.star) + '\u003c/span>' : '') +\n        '\u003cspan class=\"sp\">\u003c/span>' +\n        '\u003cbutton class=\"lift-x\" title=\"Remove (kept, never deleted)\">\u003csvg viewBox=\"0 0 24 24\">\u003cpath d=\"M6 6l12 12M18 6L6 18\"/>\u003c/svg>\u003c/button>' +\n      '\u003c/div>' +\n      '\u003cdiv class=\"lift-meta\">\u003cspan class=\"tierchip\">TIER ' + lift.tier + '\u003c/span> &middot; \u003cb>' + lift.targetSets + ' &times; ' + lift.targetReps + '\u003c/b> &middot; ' + (lift.history && lift.history.length ? 'last ' + wDisp(lift.weight) + ' ' + unit : 'first time \u00b7 set the mark') + '\u003c/div>' +\n      '\u003cdiv class=\"chips\">' +\n        '\u003cbutton class=\"chip\" data-act=\"swap\">' + SVG(ICON.swap) + 'swap\u003c/button>' +\n        '\u003cbutton class=\"chip\" data-act=\"history\">' + SVG(ICON.history) + 'history\u003c/button>' +\n        '\u003cbutton class=\"chip\" data-act=\"tune\">' + SVG(ICON.tune) + 'tune\u003c/button>' +\n        '\u003cbutton class=\"' + starCls + '\" data-act=\"star\" aria-label=\"Progressive overload\"' + (anyLogged ? ' disabled' : '') + '>' +\n          '\u003cspan class=\"starDots\" aria-hidden>\u003cspan class=\"starDot\">\u003c/span>\u003cspan class=\"starDot\">\u003c/span>\u003c/span>' +\n          '\u003cspan class=\"starGlyph\" aria-hidden>&#9733;\u003c/span>' +\n        '\u003c/button>' +\n        (starAmt ? '\u003cspan class=\"starAmt\">' + esc(starAmt) + '\u003c/span>' : '') +\n      '\u003c/div>' +\n      '\u003cdiv class=\"rows\">\u003c/div>';\n    const rows = el.querySelector('.rows');\n    lift.sets.forEach((set, i) => rows.appendChild(setRow(lift, set, i, unit)));\n    el.querySelector('.lift-x').onclick = () => hideLift(lift.id);\n    el.querySelector('.info').onclick = () => openInfo(lift);\n    el.querySelector('[data-act=\"swap\"]').onclick = () => openSwap(lift);\n    el.querySelector('[data-act=\"history\"]').onclick = () => openOverload(lift);\n    el.querySelector('[data-act=\"tune\"]').onclick = () => openTune(lift);\n    const starBtn = el.querySelector('[data-act=\"star\"]');\n    starBtn.onclick = () => { if (anyLogged) return; openOverloadCard(lift); };\n    return el;\n  }\n\n  // One set row. Tap the numbers to edit, \"hit it\" to log the typed values, \"miss\"\n  // to fail it, the reset to clear it. It re-grades itself on every change.\n  function setRow(lift, set, i, unit){\n    const kind = gradeSet(lift, set);\n    const logged = kind !== 'empty';\n    const bump = lift.overload || null;\n    const w = set.weight ?? (lift.weight + (bump ? (bump.weightKg || 0) : 0));\n    const r = set.reps ?? (lift.targetReps + (bump ? (bump.reps || 0) : 0));\n    const roman = ['i','ii','iii','iv','v','vi','vii','viii','ix','x'][i] || (i+1);\n    const row = document.createElement('div');\n    row.className = 'pill ' + kind;\n    row.innerHTML =\n      '\u003cspan class=\"pillIdx\">' + roman + '\u003c/span>' +\n      '\u003cspan class=\"pillValue\">' +\n        '\u003cinput class=\"pillInput\" type=\"text\" inputmode=\"decimal\" value=\"' + wDisp(w) + '\" aria-label=\"weight\">' +\n        '\u003cspan class=\"pillUnit\">' + unit + '\u003c/span>' +\n        '\u003cspan class=\"pillTimes\">&times;\u003c/span>' +\n        '\u003cinput class=\"pillInput\" type=\"text\" inputmode=\"numeric\" value=\"' + r + '\" aria-label=\"reps\">' +\n      '\u003c/span>' +\n      '\u003cspan class=\"pillSpacer\">\u003c/span>' +\n      '\u003cdiv class=\"pillGroup\">\u003c/div>';\n    const [wIn, rIn] = row.querySelectorAll('.pillInput');\n    const fit = el => el.setAttribute('size', Math.max(1, el.value.length));\n    fit(wIn); fit(rIn);\n    wIn.addEventListener('input', () => fit(wIn));\n    rIn.addEventListener('input', () => fit(rIn));\n    const group = row.querySelector('.pillGroup');\n    const commit = () => {\n      const wv = wKg(parseFloat(wIn.value)), rv = Math.round(parseFloat(rIn.value));\n      if (!isFinite(wv) || wv \u003c 0 || wv > 1000) return;\n      if (!isFinite(rv) || rv \u003c= 0 || rv > 100) return;\n      set.weight = wv; set.reps = rv; set.done = true; set.failed = false;\n      saveLog(); render();\n      if (typeof restCoachStart === 'function') restCoachStart(lift, set);  // ep4: start the rest clock\n    };\n    if (logged){\n      const word = statusWord(lift, set, kind);\n      group.innerHTML = '\u003cspan class=\"pillStatus\">' + (kind==='over' ? '\u003cspan class=\"pillPr\">&#9733; \u003c/span>' : '') + word + '\u003c/span>' +\n        '\u003cbutton class=\"pillReset\" title=\"Reset this set\">\u003csvg viewBox=\"0 0 14 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M3.5 5.5 A4 4 0 1 0 5.5 2.5\"/>\u003cpolyline points=\"2 2 3.5 5.5 7 4.5\"/>\u003c/svg>\u003c/button>';\n      group.querySelector('.pillReset').onclick = () => { set.done=false; set.failed=false; set.weight=null; set.reps=null; saveLog(); render(); if (typeof rcOnSetReset === 'function') rcOnSetReset(set); };\n    } else {\n      group.innerHTML = '\u003cbutton class=\"pillHit\">hit it &rarr;\u003c/button>\u003cbutton class=\"pillMiss\">miss\u003c/button>';\n      group.querySelector('.pillHit').onclick = commit;\n      group.querySelector('.pillMiss').onclick = () => { set.failed=true; set.done=false; saveLog(); render(); };\n    }\n    wIn.onkeydown = rIn.onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); commit(); } };\n    return row;\n  }\n\n  // Add a lift. Never lose one: if it already exists (even removed), bring it back\n  // with its full history; if it is a real library lift, add it as that.\n  function quickAddLift(name){\n    name = name.trim();\n    if (!name) return;\n    const existing = LIFTS.find(l => l.name.toLowerCase() === name.toLowerCase());\n    if (existing){ existing.hidden = false; saveLog(); render(); return; }\n    const lib = LIB.find(e => e.name.toLowerCase() === name.toLowerCase());\n    if (lib){ addFromLibrary(lib); return; }\n    addLift({ name, tier:3, muscle: guessMuscle(name) || 'chest', targetSets:3, targetReps:8, weight:20, sets: blankSets(3) });\n    render();\n  }\n\n  // Remove a lift and it is only HIDDEN, never destroyed. Its history stays in\n  // storage, so a mis-tap cannot wipe a month of progress.\n  function hideLift(id){\n    const l = LIFTS.find(x => x.id === id);\n    if (l){ l.hidden = true; saveLog(); render(); }\n  }\n  function restoreLift(id){\n    const l = LIFTS.find(x => x.id === id);\n    if (l){ l.hidden = false; saveLog(); render(); }\n  }\n  function renderHidden(){\n    const hid = LIFTS.filter(l => l.hidden);\n    if (!hid.length){ hiddenEl.innerHTML = ''; return; }\n    hiddenEl.innerHTML = '\u003cdiv class=\"hidden-bar\">\u003ch4>' + hid.length + ' removed &middot; nothing lost\u003c/h4>\u003c/div>';\n    const bar = hiddenEl.querySelector('.hidden-bar');\n    hid.forEach(l => {\n      const row = document.createElement('div');\n      row.className = 'hidden-row';\n      row.innerHTML = '\u003cspan class=\"hn\">' + esc(l.name) + '\u003c/span>\u003cspan class=\"keep\">history kept\u003c/span>\u003cbutton class=\"restore\">restore\u003c/button>';\n      row.querySelector('.restore').onclick = () => restoreLift(l.id);\n      bar.appendChild(row);\n    });\n  }\n\n  // Reorder the session with plain up/down arrows. Each arrow moves  LIFTS.indexOf(b);\n    LIFTS[ia] = b; LIFTS[ib] = a;\n    saveLog(); render();\n    renderReorder(id);\n  }\n\n  // modal: info card\n  const modal = document.getElementById('modal');\n  const sheet = document.getElementById('sheet');\n  function openSheet(html){ sheet.className = 'sheet'; sheet.innerHTML = '\u003cbutton class=\"sheet-close\" aria-label=\"Close\">&times;\u003c/button>' + html; sheet.querySelector('.sheet-close').onclick = closeSheet; modal.classList.add('on'); }\n  function closeSheet(){ modal.classList.remove('on'); }\n  // deliberate: tapping outside does NOT close the sheet. Mid-rename or mid-setting,\n  // a stray tap should never eat the card. Only the \u00d7 button (or Escape) closes it.\n  document.addEventListener('keydown', e => { if (e.key === 'Escape' && modal.classList.contains('on')) { closeSheet(); e.stopImmediatePropagation(); } });\n  // @episode-end:logger\n\n  // @episode-start:rest-timer\n  // EP4: the rest coach. Log a set and a rest clock floats up, so the pause between\n  // sets becomes coaching time instead of doom-scrolling. It shows what you just did,\n  // what is next, and an Ask Claude pill that opens Claude already knowing this lift.\n  // Naive on purpose: it ticks with a plain interval, so on a locked phone it drifts.\n  // The hosted Vitality timer is wall-clock accurate (endsAt) and never drifts. This\n  // card lives OUTSIDE render(), so the list re-rendering never wipes it.\n  const rcEl = document.getElementById('restCoach');\n  const RC_C = 201;                 // ring circumference, 2*pi*r with r=32\n  let rcInt = null, rcRemain = 0, rcTotal = 0, rcLift = null, rcSet = null, rcOver = false, rcHideT = null, rcFadeT = null;\n\n  const rcFmt = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };\n  const rcNext = lift => lift ? lift.sets.find(s => !s.done && !s.failed) : null;\n\n  function rcAskPrompt(lift, set){\n    const u = uLabel(lift.perHand);\n    const did  = wDisp(set.weight) + ' ' + u + ' \u00d7 ' + set.reps;\n    const plan = lift.targetSets + ' \u00d7 ' + lift.targetReps + ' at ' + wDisp(lift.weight) + ' ' + u;\n    const tail = rcNext(lift)\n      ? 'I am resting ' + rcFmt(lift.rest ?? 150) + ' before my next set. Give me one specific cue to hit my next set clean, and tell me whether that rest is right for this lift.'\n      : 'That was my last set of this lift. Tell me how it looks against my plan, and one thing to focus on next time.';\n    return 'I just did a set of ' + lift.name + ' (tier ' + lift.tier + '): ' + did + '. My plan is ' + plan + '. ' +\n      tail + ' Keep it to two or three sentences, no preamble.';\n  }\n  function rcAsk(){ if (!rcLift || !rcSet) return; window.open('https://claude.ai/new?q=' + encodeURIComponent(rcAskPrompt(rcLift, rcSet)), '_blank', 'noopener'); }\n\n  function rcPaint(){\n    if (!rcLift) return;\n    document.getElementById('rcLiftName').textContent = rcLift.name;\n    const t = document.getElementById('rcTime');\n    if (rcOver){ rcEl.classList.add('go'); t.textContent = 'GO'; }\n    else { rcEl.classList.remove('go'); t.textContent = rcFmt(rcRemain); }\n  }\n  function rcTick(){ rcRemain -= 1; if (rcRemain \u003c= 0 && !rcOver) rcFinish(); rcPaint(); }\n  function rcFinish(){\n    rcOver = true; clearInterval(rcInt); rcInt = null;\n    if (navigator.vibrate){ try { navigator.vibrate([40, 60, 40]); } catch(e){} }\n    clearTimeout(rcHideT); rcHideT = setTimeout(rcDismiss, 6000);\n  }\n  function restCoachStart(lift, set){\n    if (!rcEl) return;\n    const restSec = lift.rest ?? 150;\n    if (restSec \u003c= 0){ rcDismiss(); return; }   // rest turned off: no timer, no card\n    rcLift = lift; rcSet = set; rcOver = false;\n    rcTotal = restSec; rcRemain = rcTotal;\n    clearInterval(rcInt); clearTimeout(rcHideT); clearTimeout(rcFadeT);\n    document.body.classList.add('rc-open');\n    rcEl.hidden = false; rcEl.classList.remove('go');\n    requestAnimationFrame((
