<!doctype html>
<html lang="en">
<head><style id="thm">:root{--mint:#6EE7B7;--mint2:#5dd6a6;--mint-cool:#A7F3D0;--mint-hi:var(--mint-cool);--mint-ink:#042a1c;--mint-glow:rgba(110,231,183,.4);--teal:#1f4d3d;--acc-rgb:110,231,183;--hue:160;--iris:var(--mint);--iris-hi:var(--mint-cool);--iris-glow:rgba(var(--acc-rgb),.42)}.swatches{display:flex;flex-wrap:wrap;gap:6px 10px}

.swb:hover i{transform:translateY(-2px)}.swb.on i{border-color:#fff}.swb.on{color:#fff}.swb em{font-style:normal;font-size:.54rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mint)}
.swb.cu i{background:conic-gradient(#f87171,#fbbf24,#6EE7B7,#60a5fa,#a78bfa,#f472b6,#f87171)}.swb.cu input{position:absolute;opacity:0;width:0;height:0}.swb.cu{position:relative}
.thNote{font-size:.72rem;color:var(--muted);margin-top:10px;line-height:1.5}
@media(min-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
.tile[data-id="library"] .ctl.remove{display:none!important}

#onb .sky{position:absolute;inset:0;pointer-events:none}#onb .sky i{position:absolute;border-radius:50%;background:var(--mint);opacity:.1;animation:onTw 4s ease-in-out infinite}
@keyframes onTw{0%,100%{opacity:.08}50%{opacity:.7}}

#onb .oq{font:italic 400 clamp(2rem,8vw,2.7rem)/1.12 var(--serif);letter-spacing:-.02em;margin:16px 0 8px;color:#f3f1fb}#onb .oq em{color:var(--mint)}#onb .osub{color:var(--muted-strong);font-size:1.02rem;line-height:1.5;margin:0 0 22px;max-width:34ch}

#onb .oseg{display:inline-flex;border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:5px;background:rgba(255,255,255,.03);margin-bottom:20px}#onb .oseg button{padding:11px 24px;border-radius:999px;font:500 1rem var(--sans);color:var(--muted-strong)}#onb .oseg button.on{background:var(--mint);color:var(--mint-ink);font-weight:700}
#onb .onav{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:26px;padding-top:20px;border-top:1px solid rgba(255,255,255,.08)}
#onb .oback{font:italic 400 1.25rem var(--serif);color:var(--muted);padding:10px 14px}#onb .oback:hover{color:var(--mint)}
#onb .onext{display:inline-flex;align-items:center;gap:10px;padding:17px 32px;border-radius:999px;background:var(--mint);color:var(--mint-ink);font:700 1.08rem var(--sans);box-shadow:0 8px 30px rgba(var(--acc-rgb),.3);transition:transform .15s var(--ease),background .18s}#onb .onext:hover{background:var(--mint2)}#onb .onext:active{transform:scale(.97)}
#onb .oerr{color:#fca5a5;font-size:.9rem;min-height:22px;margin-top:12px}#onb .ohint{color:var(--muted);font-size:.84rem;line-height:1.55;margin-top:12px;max-width:38ch}#onb .ohint a{color:var(--mint)}
#onb .oedit{margin-top:18px;font:italic 400 1.15rem var(--serif);color:var(--muted)}#onb .oedit:hover{color:var(--mint)}
@media(prefers-reduced-motion:reduce){#onb *{animation:none!important}}
.pfg{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}.trayCard input[type=text],.trayCard input[type=number],.trayCard input[type=password]{width:100%;padding:10px;border-radius:6px;border:1px solid var(--border);background:rgba(255,255,255,.025);color:#fff;font:inherit;font-size:16px;outline:none;-webkit-user-select:text;user-select:text}.trayCard input:focus{border-color:var(--mint)}.pfr{display:flex;align-items:center;gap:12px;margin-top:10px}
.hbtns{display:flex;gap:10px;flex:none}
.icoBtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--border-strong);background:rgba(255,255,255,.04);color:#f3f1fb;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .2s var(--ease),color .2s var(--ease),background .2s var(--ease),transform .15s var(--ease)}
.icoBtn svg{width:19px;height:19px}.icoBtn:hover{border-color:var(--mint);color:var(--mint)}.icoBtn:active{transform:scale(.94)}
.icoBtn .ic-ok{display:none}body.editing #editBtn{background:var(--mint);color:var(--mint-ink);border-color:var(--mint)}body.editing #editBtn .ic-pen{display:none}body.editing #editBtn .ic-ok{display:block}
#set{position:fixed;inset:0;z-index:450;background:radial-gradient(60% 40% at 50% 0%,rgba(var(--acc-rgb),.14),transparent 70%),#05070a;overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 60px;display:none}#set.open{display:block}
#set .sw{max-width:680px;margin:0 auto}#set button{background:none;border:0;color:inherit;font:inherit;cursor:pointer}
#set .back{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(var(--acc-rgb),.45);background:rgba(var(--acc-rgb),.08);color:var(--mint);border-radius:999px;padding:8px 16px;font:600 .85rem var(--sans)}
#set h1{font:italic 400 3rem/1 var(--serif);margin:22px 0 8px;letter-spacing:-.02em}#set .it{font:italic 400 .95rem var(--serif);color:var(--muted-strong)}#set .lede{color:var(--muted-strong);font-size:.98rem;line-height:1.5;margin:6px 0 20px}
#set .cd{border:1px solid var(--border);border-radius:14px;background:rgba(255,255,255,.025);padding:22px;margin-bottom:16px}
#set .fl{font:600 .62rem var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
#set .fi{width:100%;background:none;border:0;border-bottom:1px solid var(--border-strong);border-radius:0;color:#fff;font:500 1.15rem var(--sans);padding:6px 0 10px;outline:none;-webkit-user-select:text;user-select:text;caret-color:var(--mint)}#set .fi:focus{border-bottom-color:var(--mint)}#set .fi.big{font-size:1.9rem;font-weight:600}
#set .rw{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:22px 0}#set .g2{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:22px 0}#set .fw{position:relative}#set .fw .fi{padding-right:34px}
#set .unit{position:absolute;right:0;bottom:12px;font:italic 400 .9rem var(--serif);color:var(--muted)}#set .two{display:flex;gap:10px}
#set .sg{display:inline-flex;border:1px solid var(--border-strong);border-radius:999px;padding:4px}#set .sg button{padding:8px 18px;border-radius:999px;font:600 .82rem var(--sans);color:var(--muted-strong)}#set .sg button.on{background:var(--mint);color:var(--mint-ink)}
#set .ro{font-size:1.05rem;color:var(--muted-strong);word-break:break-all}
#set .save{display:block;margin:6px 0 0 auto;padding:15px 28px;border-radius:999px;background:var(--mint);color:var(--mint-ink);font:700 .95rem var(--sans)}
#set h2{font:italic 400 1.7rem var(--serif);margin:0 0 10px}#set p{color:var(--muted-strong);font-size:.95rem;line-height:1.55}#set ul{margin:14px 0 0;padding:0;list-style:none}#set li{padding:6px 0 6px 18px;position:relative;color:var(--muted-strong);font-size:.93rem;line-height:1.5}#set li:before{content:'';position:absolute;left:0;top:14px;width:5px;height:5px;border-radius:50%;background:var(--mint)}

#onb.authv .oin.key{margin-top:0}

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Imperium</title>
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Imperium"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="theme-color" content="#000000"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
button{background:none}

  :root{
    --bg:#000; --fg:#fff;
       
    
    --border:rgba(255,255,255,.08); --border-strong:rgba(255,255,255,.16);
    --muted:rgba(255,255,255,.46); --muted-strong:rgba(255,255,255,.72);
    --serif:'Instrument Serif',Georgia,serif;
    --sans:'Inter','Hanken Grotesk',system-ui,-apple-system,sans-serif;
    --ease:cubic-bezier(.22,1,.36,1);
    --ease-spring:cubic-bezier(.34,1.56,.64,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;font-family:var(--sans);color:var(--fg);letter-spacing:-.01em;
    -webkit-font-smoothing:antialiased;
    /* the dark surround that frames the "device" */
    background:
      radial-gradient(60% 40% at 50% 0%, rgba(var(--acc-rgb),.05), transparent 70%),
      #050606;
    display:grid;place-items:center;min-height:100vh;padding:34px 16px;
  }

  /* ---------- the phone ---------- */
  .phone{
    position:relative;width:100%;max-width:412px;height:min(860px,calc(100vh - 68px));
    border-radius:46px;overflow:hidden;
    border:1px solid var(--border-strong);
    box-shadow:0 50px 120px -40px rgba(0,0,0,.9), 0 0 0 9px #0a0b0b, 0 0 0 10px rgba(255,255,255,.04);
    display:flex;flex-direction:column;
    transition:background .5s var(--ease);
    background:var(--bg);
  }
  /* selectable wallpapers */
  .phone[data-wall="midnight"]{background:#000}
  .phone[data-wall="aurora"]{
    background:
      radial-gradient(70% 50% at 22% 8%, rgba(var(--acc-rgb),.22), transparent 60%),
      radial-gradient(60% 45% at 88% 30%, hsl(var(--hue) 43% 21% / .5), transparent 62%),
      hsl(var(--hue) 33% 1%);
  }
  .phone[data-wall="tide"]{
    background:linear-gradient(180deg, hsl(var(--hue) 68% 7%) 0%, hsl(var(--hue) 60% 4%) 48%, #000 100%);
  }
  .phone[data-wall="frost"]{
    background:
      radial-gradient(80% 50% at 50% -5%, rgba(var(--acc-rgb),.14), transparent 60%),
      linear-gradient(180deg,#070a0d,#000 70%);
  }

  /* status strip */
  .status{display:flex;align-items:center;justify-content:space-between;padding:14px 26px 4px;font-size:.78rem;font-weight:600;color:rgba(255,255,255,.92);flex:none}
  .status .dots{display:flex;gap:5px;align-items:center}
  .status .dots svg{width:16px;height:13px;opacity:.92}

  /* scrolling screen */
  .screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 20px 26px;scrollbar-width:none}
  .screen::-webkit-scrollbar{display:none}

  /* ---------- greeting ---------- */
  .head{padding:16px 4px 18px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .greet{min-width:0}
  .hi{font-size:1.62rem;font-weight:600;letter-spacing:-.03em;line-height:1.12}
  .hi .accent{color:var(--mint)}
  .hi[contenteditable="true"]{outline:none;border-bottom:1.5px dashed rgba(var(--acc-rgb),.5);cursor:text}
  .sub{margin-top:5px;font-size:.84rem;color:var(--muted)}
  .editBtn{
    flex:none;display:inline-flex;align-items:center;gap:7px;cursor:pointer;
    font-family:inherit;font-size:.82rem;font-weight:600;color:var(--mint-ink);
    background:var(--mint);border:0;border-radius:999px;padding:9px 16px;
    transition:transform .2s var(--ease),background .2s var(--ease),box-shadow .3s var(--ease);
    box-shadow:0 6px 22px -10px var(--mint-glow);
  }
  .editBtn:hover{transform:translateY(-1px)}
  .editBtn:active{transform:scale(.96)}
  .editBtn svg{width:15px;height:15px}
  /* in edit mode the button goes ghost-"Done" */
  body.editing .editBtn{background:transparent;color:var(--mint);border:1px solid var(--mint);box-shadow:none}

  /* ---------- customize tray (edit mode only) ---------- */
  .tray{
    max-height:0;opacity:0;overflow:hidden;
    transition:max-height .45s var(--ease),opacity .35s var(--ease),margin .45s var(--ease);
    margin:0 4px;
  }
  body.editing .tray{max-height:760px;opacity:1;margin:0 4px 18px}
  .trayCard{
    border:1px solid var(--border);border-radius:20px;padding:15px 16px;
    background:rgba(255,255,255,.03);backdrop-filter:blur(8px);
  }
  .trayLabel{font-size:.7rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:11px}
  .walls{display:flex;gap:11px}
  .wall{
    flex:1;height:46px;border-radius:13px;cursor:pointer;position:relative;
    border:1px solid var(--border-strong);transition:transform .2s var(--ease),border-color .2s var(--ease);
  }
  .wall:hover{transform:translateY(-2px)}
  .wall[data-sel="1"]{border-color:var(--mint)}
  .wall[data-sel="1"]::after{
    content:'';position:absolute;inset:0;border-radius:13px;box-shadow:inset 0 0 0 2px var(--mint);
  }
  .wall.w-midnight{background:#000}
  .wall.w-aurora{background:radial-gradient(120% 90% at 25% 10%, rgba(var(--acc-rgb),.5), transparent 60%),hsl(var(--hue) 60% 4%)}
  .wall.w-tide{background:linear-gradient(180deg,hsl(var(--hue) 67% 12%),hsl(var(--hue) 60% 4%))}
  .wall.w-frost{background:radial-gradient(120% 90% at 50% 0%, rgba(var(--acc-rgb),.34), transparent 60%),#070a0d}

  /* ---------- the grid ---------- */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:2px 4px 0;align-items:start}

  .tile{
    position:relative;border-radius:24px;overflow:hidden;cursor:pointer;
    border:1px solid var(--border);
    min-height:126px;display:flex;flex-direction:column;justify-content:flex-end;
    padding:15px;color:#fff;isolation:isolate;
    transition:transform .28s var(--ease),border-color .28s var(--ease),box-shadow .35s var(--ease),opacity .3s var(--ease);
    animation:pop .5s var(--ease-spring) both;
  }
  .tile.lg{grid-column:span 2;min-height:150px}
  .tile.tall{min-height:172px}
  .tile:not(.dragging):active{transform:scale(.97)}
  .tile:hover{border-color:rgba(var(--acc-rgb),.28)}
  .tileArt{position:absolute;inset:0;z-index:-1}
  .tileArt svg{position:absolute;inset:0;width:100%;height:100%}
  .scrim{position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg, hsl(var(--hue) 33% 1% / .82), hsl(var(--hue) 33% 1% / .15) 55%, transparent)}
  .tName{font-size:1.02rem;font-weight:600;letter-spacing:-.02em}
  .tStat{margin-top:3px;font-size:.78rem;color:rgba(255,255,255,.66)}
  .tStat b{color:var(--mint);font-weight:600}
  .tIcon{position:absolute;top:14px;left:15px;width:26px;height:26px;color:var(--mint);opacity:.95;z-index:1}
  .tIcon svg{width:100%;height:100%}

  /* "built by you" whisper on user tiles */
  .made{position:absolute;top:15px;right:15px;z-index:1;font-size:.62rem;font-weight:600;letter-spacing:.03em;
    color:var(--mint);background:rgba(var(--acc-rgb),.1);border:1px solid rgba(var(--acc-rgb),.26);border-radius:999px;padding:3px 8px}

  /* ---------- edit mode: iOS jiggle ---------- */
  body.editing .tile{animation:jiggle .42s infinite ease-in-out}
  body.editing .tile:nth-child(2n){animation-delay:-.21s}
  body.editing .tile:nth-child(3n){animation-delay:-.12s}
  @keyframes jiggle{
    0%{transform:rotate(-.55deg) scale(.99)}
    50%{transform:rotate(.55deg) scale(.99)}
    100%{transform:rotate(-.55deg) scale(.99)}
  }
  body.editing .tile{cursor:grab}
  .tile.dragging{opacity:.4;animation:none !important;cursor:grabbing}

  /* remove + resize controls (edit mode) */
  .ctl{position:absolute;z-index:3;display:none;align-items:center;justify-content:center;cursor:pointer;
    border-radius:999px;backdrop-filter:blur(6px);transition:transform .18s var(--ease)}
  body.editing .ctl{display:flex}
  .ctl:active{transform:scale(.86)}
  .remove{top:9px;left:9px;width:25px;height:25px;background:rgba(10,10,10,.78);border:1px solid rgba(255,255,255,.28);color:#fff}
  .remove svg{width:13px;height:13px}
  .resize{top:9px;right:9px;height:25px;padding:0 10px;gap:5px;background:rgba(10,10,10,.78);border:1px solid rgba(255,255,255,.28);color:#fff;font-size:.66rem;font-weight:600}
  .resize svg{width:12px;height:12px}
  body.editing .made{display:none}

  /* add-a-tile slot */
  .addSlot{
    display:none;grid-column:span 2;min-height:74px;border-radius:22px;cursor:pointer;

  }

  .sheetWrap.open .sheet{transform:none}
  .grab{width:38px;height:4px;border-radius:999px;background:rgba(255,255,255,.2);margin:6px auto 14px}
  .sheetTitle{font-size:1.18rem;font-weight:600;letter-spacing:-.02em;margin-bottom:3px}
  .sheetSub{font-size:.82rem;color:var(--muted);margin-bottom:16px}
  .addRow{display:flex;align-items:center;gap:13px;padding:11px 10px;border-radius:16px;cursor:pointer;transition:background .18s var(--ease)}
  .addRow:hover{background:rgba(255,255,255,.04)}
  .addRow .ic{flex:none;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:var(--mint);

  .addRow .plus{flex:none;color:var(--mint)}

  .addRow.gone{display:none}
  .sheetEmpty{text-align:center;color:var(--muted);font-size:.84rem;padding:26px 0 8px}

  /* helper caption under the device */
  .cap{margin-top:18px;text-align:center;color:var(--muted);font-size:.82rem;max-width:412px;line-height:1.5}
  .cap b{color:var(--muted-strong);font-weight:600}

  @keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    .tile,.addSlot{animation:none}
    body.editing .tile{animation:none}
  }

<script id="emb-train" type="application/json">"\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\u003cstyle id=\"thm\">:root{--mint:#6EE7B7;--mint2:#5dd6a6;--mint-cool:#A7F3D0;--mint-hi:var(--mint-cool);--mint-ink:#042a1c;--mint-glow:rgba(110,231,183,.4);--teal:#1f4d3d;--acc-rgb:110,231,183;--hue:160;--iris:var(--mint);--iris-hi:var(--mint-cool);--iris-glow:rgba(var(--acc-rgb),.42)}\u003c/style>\u003cscript>(function(){try{var t=JSON.parse(localStorage.getItem(\"imperium.theme.v1\")||\"null\");if(t&&t.vars){var s=document.documentElement.style;for(var k in t.vars)s.setProperty(k,t.vars[k])}}catch(e){}})()\u003c/script>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>The Living Logger\u003c/title>\n\u003clink rel=\"preconnect\" href=\"\" crossorigin>\u003clink rel=\"preconnect\" href=\"https://cdn.jsdelivr.net\">\u003cscript>document.documentElement.classList.add(\"booting\")\u003c/script>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n\u003cmeta name=\"theme-color\" content=\"#000000\">\n\u003cmeta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n\u003cmeta name=\"mobile-web-app-capable\" content=\"yes\">\n\u003cmeta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">\n\u003cmeta name=\"apple-mobile-web-app-title\" content=\"Living Logger\">\n\n\n\u003c!--\n  THE LIVING LOGGER. One self-contained file that grows one episode at a time.\n  Each feature lives inside a marked region a factory script can cut on its own:\n    chart    (Episode 1, progressive overload)  \u003c!-- @episode-start:chart -->  ...  \u003c!-- @episode-end:chart -->\n    logger   (Episode 2, the workout logger)    \u003c!-- @episode-start:logger -->  ...  \u003c!-- @episode-end:logger -->\n    library  (Episode 3, the exercise library)  \u003c!-- @episode-start:library -->  ...  \u003c!-- @episode-end:library -->\n  No build step, no server, no external CDN. State lives in localStorage.\n  Pure black, mint accent, Inter. Open it in a browser and it just works.\n-->\n\u003cstyle>\nbutton{background:none}\n\n  :root{\n    --bg:#000; --fg:#fff;\n      --mint-hover:var(--mint2); --amber:#F59E0B; --rose:#e0767b; --gold:#f1cf7a;\n    --muted:rgba(255,255,255,.5); --muted-strong:rgba(255,255,255,.72);\n    --rule:rgba(255,255,255,.08); --rule-strong:rgba(255,255,255,.16);\n    --card:rgba(255,255,255,.022);\n    --serif:'Instrument Serif','Newsreader',Georgia,serif;\n    --sans:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;\n    --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;\n    --ease:cubic-bezier(.16,1,.3,1); --spring:cubic-bezier(.34,1.56,.64,1);\n  }\n  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}\n  ::selection{background:rgba(var(--acc-rgb),.25);color:#fff}\n  html,body{background:var(--bg);min-height:100%}\n  body{font-family:var(--sans);color:var(--fg);-webkit-font-smoothing:antialiased;letter-spacing:-.006em;\n    padding:34px 18px 90px;display:block;overflow-x:hidden}\n  body.rc-open{padding-bottom:120px}   /* ep4: room so the rest coach never covers the last set */\n\n  /* background: light at the top, gradient down to pure black, snowy particles */\n  .atmos{position:fixed;inset:0;z-index:0;pointer-events:none;\n    background:\n      radial-gradient(ellipse 70% 40% at 50% -4%, rgba(var(--acc-rgb),.16), transparent 60%),\n      linear-gradient(180deg, hsl(var(--hue) 48% 5%) 0%, hsl(var(--hue) 38% 3%) 32%, hsl(var(--hue) 33% 1%) 64%, #000 100%);}\n  #snow{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.9}\n\n  .w y:var(--serif);font-style:italic;font-size:11px;display:grid;place-items:center;cursor:pointer;opacity:.8;transition:opacity .2s,background .2s}\n  .info:hover{opacity:1;background:rgba(var(--acc-rgb),.08)}\n  .lift-head .sp{flex:1}\n  .lift-x{flex:none;background:none;border:none;color:var(--muted);cursor:pointer;padding:5px;border-radius:8px;opacity:.5;transition:color .2s,opacity .2s,background .2s}\n  .lift-x:hover{color:var(--rose);opacity:1;background:rgba(224,118,123,.08)}\n  .lift-x svg{width:17px;height:17px;display:block;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}\n\n  .lift-meta{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 0 14px}\n  .tierchip{border:1px solid var(--rule-strong);border-radius:6px;padding:4px 8px;letter-spacing:.14em;color:var(--muted-strong)}\n\n  /* per-lift action chips */\n  .chips{display:flex;align-items:center;gap:9px;margin-bottom:16px}\n  .chip{display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(var(--acc-rgb),.26);border-radius:999px;\n    background:rgba(var(--acc-rgb),.03);color:var(--mint);font-family:var(--serif);font-style:italic;font-size:15px;\n    padding:8px 15px;cursor:pointer;box-shadow:0 0 14px rgba(var(--acc-rgb),.06);transition:border-color .2s,background .2s,transform .15s var(--spring)}\n  .chip:hover{border-color:rgba(var(--acc-rgb),.5);background:rgba(var(--acc-rgb),.07)} .chip:active{transform:scale(.95)}\n  .chip svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}\n  /* progressive-overload star pill (dots + star at the end of the chips row) */\n  .starPill{position:relative;display:inline-flex;align-items:center;justify-content:center;padding:6px 8px;margin-left:2px;\n    border:none;background:transparent;color:var(--mint);cursor:pointer;overflow:visible;transition:transform .2s var(--ease),color .2s var(--ease)}\n  .starDots{display:inline-flex;align-items:center;gap:3px;margin-right:5px}\n  .starDot{width:3px;height:3px;border-radius:50%;background:var(--mint);opacity:.45;transition:opacity .2s var(--ease),background .2s var(--ease)}\n  .starPillArmed .starDot{background:var(--gold);opacity:.7}\n  .starGlyph{font-family:var(--serif);font-size:1.5rem;line-height:1;color:inherit;filter:drop-shadow(0 0 6px rgba(var(--acc-rgb),.45));transition:transform .2s var(--ease)}\n  .starPill:hover .starGlyph{transform:scale(1.1)}\n  .starPill:focus-visible{outline:2px solid var(--mint);outline-offset:3px;border-radius:8px}\n  .starPillArmed{color:var(--gold)}\n  .starPillArmed .starGlyph{filter:drop-shadow(0 0 8px rgba(241,207,122,.55));animation:armedBreathe 2.8s ease-in-out infinite}\n  @keyframes armedBreathe{0%,100%{transform:scale(1);opacity:.95}50%{transform:scale(1.09);opacity:1}}\n  .starPillInert{opacity:.3;cursor:default;color:var(--muted)}\n  .starPillInert .starGlyph{filter:none;animation:none}\n  .starPillInert:hover .starGlyph{transform:none}\n  .starPillDone{opacity:.4;cursor:default;color:var(--mint)}\n  .starPillDone .starGlyph{filter:none;animation:none}\n  .starPillDone .starDot{background:var(--mint);opacity:.35}\n  .starPillDone:hover .starGlyph{transform:none}\n  .starAmt{align-self:center;font-family:var(--serif);font-style:italic;font-size:.95rem;color:var(--gold);margin-left:1px;text-shadow:0 0 9px rgba(241,207,122,.3)}\n\n  /* small steady gold star beside the lift name once it is a conquered overload */\n  .conqueredStar{flex:none;width:16px;height:16px;align-self:center;color:var(--gold);filter:drop-shadow(0 0 5px rgba(241,207,122,.4))}\n  .conqueredStar svg{width:16px;height:16px;display:block;fill:currentColor}\n\n  /* celebration: the one-time gold flush + star burst when a lift becomes a\n     conquered overload (all sets logged + one beats the previous best). On-card. */\n  .lift{position:relative}\n  .lift.conquered .starGlyph{color:var(--gold)}\n  .lift.celebrate .pillValue{animation:goldNum 1.6s var(--ease)}\n  @keyframes goldNum{0%,100%{color:inherit;text-shadow:none}26%{color:var(--gold);text-shadow:0 0 14px rgba(241,207,122,.55)}}\n  .lift.celebrate .lift-name{animation:goldName 1.5s var(--ease)}\n  @keyframes goldName{0%,100%{color:var(--fg)}26%{color:var(--gold);text-shadow:0 0 18px rgba(241,207,122,.45)}}\n  .lift.celebrate .starPill{animation:starBig 1.15s var(--spring);color:var(--gold);opacity:1}\n  .lift.celebrate .starGlyph{filter:drop-shadow(0 0 10px rgba(241,207,122,.6))}\n  @keyframes starBig{0%{transform:scale(1)}30%{transform:scale(1.55)}100%{transform:scale(1)}}\n  .lift.celebrate .starPill::after{content:'';position:absolute;inset:0;border-radius:50%;pointer-events:none;box-shadow:0 0 0 0 rgba(241,207,122,.6);animation:starRing 1.15s var(--ease) forwards}\n  @keyframes starRing{0%{box-shadow:0 0 0 0 rgba(241,207,122,.6)}100%{box-shadow:0 0 0 30px rgba(241,207,122,0)}}\n\n  .rows{display:flex;flex-direction:column;gap:9px}\n\n  /* the set pill (real Vitality row) */\n  .pill{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;border:1px solid var(--rule);\n    background:var(--card);position:relative;overflow:hidden;min-width:0;\n    transition:background .4s var(--ease),border-color .4s var(--ease),color .4s var(--ease)}\n  .pillIdx{font-family:var(--serif);font-style:italic;font-size:16px;color:var(--muted);width:20px;flex:none}\n  .pillValue{font-size:19px;font-weight:500;letter-spacing:-.01em;display:inline-flex;align-items:baseline;white-space:nowrap}\n  .pillInput{background:transparent;border:none;outline:none;color:inherit;font:inherit;font-weight:600;\n    text-align:center;field-sizing:content;width:auto;min-width:1.4ch;padding:0 1px;border-bottom:1px solid transparent;\n    transition:border-color .25s var(--ease),color .25s var(--ease)}\n  .pill:hover .pillInput{border-bottom-color:rgba(var(--acc-rgb),.22)}\n  .pillInput:focus{color:var(--mint);border-bottom-color:var(--mint)}\n  .pillUnit{color:var(--muted);font-family:var(--serif);font-style:italic;font-size:.7em;margin-left:3px;letter-spacing:.02em}\n  .pillTimes{color:var(--muted);margin:0 7px;font-weight:400}\n  .pillSpacer{flex:1}\n  .pillGroup{display:inline-flex;align-items:center;gap:9px}\n  .pillHit{background:none;border:none;font-family:var(--serif);font-style:italic;font-size:14px;color:var(--mint);cursor:pointer;white-space:nowrap;padding:2px;transition:color .2s}\n  .pillMiss{background:none;border:none;font-family:var(--serif);font-style:italic;font-size:14px;color:var(--muted);cursor:pointer;padding:2px;transition:color .2s}\n  .pillMiss:hover{color:var(--rose)}\n  .pillStatus{font-family:var(--serif);font-style:italic;font-size:14px;white-space:nowrap}\n  .pillReset{background:none;border:none;color:currentColor;cursor:pointer;opacity:.6;padding:5px;border-radius:50%;display:inline-flex;transition:opacity .2s,background .2s}\n  .pillReset:hover{opacity:1;background:rgba(0,0,0,.12)} .pillReset svg{width:13px;height:13px;display:block}\n  .pillPr{font-family:var(--serif);font-style:italic;color:#a87f12}\n\n  .pill.clean,.pill.over{background:var(--mint);border-color:var(--mint);color:#000}\n  .pill.clean .pillIdx,.pill.over .pillIdx,.pill.clean .pillTimes,.pill.over .pillTimes{color:rgba(0,0,0,.55)}\n  .pill.clean .pillInput,.pill.over .pillInput{color:#000}\n  .pill.clean .pillUnit,.pill.over .pillUnit{color:rgba(0,0,0,.55)}\n  .pill.clean .pillHit,.pill.over .pillHit,.pill.clean .pillStatus,.pill.over .pillStatus{color:#000}\n  .pill.partial{background:rgba(245,158,11,.14);border-color:var(--amber);color:var(--fg)}\n  .pill.partial .pillIdx,.pill.partial .pillStatus,.pill.partial .pillUnit{color:var(--amber)}\n  .pill.failed{background:rgba(224,118,123,.12);border-color:var(--rose);color:var(--fg)}\n  .pill.failed .pillIdx,.pill.failed .pillStatus{color:var(--rose)}\n  .pill.failed .pillValue{text-decoration:line-through;color: rm:translateX(-50%) translateY(0)}\n  .rest-coach.go{border-color:rgba(241,207,122,.55);animation:rcGo 1.5s var(--ease) infinite}\n  .rc-mid{flex:1;min-width:0;text-align:center}\n  .rc-time{font-family:var(--serif);font-style:italic;font-size:26px;line-height:1;color:var(--mint);font-variant-numeric:tabular-nums}\n  .rest-coach.go .rc-time{color:var(--gold)}\n  .rc-ex{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:4px;\n    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n  .rest-coach.go .rc-ex{color:var(--gold)}\n  .rc-step{flex:none;background:transparent;border:1px solid var(--rule-strong);color:var(--fg);\n    font-size:13px;font-variant-numeric:tabular-nums;width:52px;height:38px;border-radius:999px;cursor:pointer;\n    transition:border-color .2s,color .2s}\n  .rc-step:hover{border-color:var(--mint);color:var(--mint)}\n  .rc-x{flex:none;width:30px;height:30px;border:none;background:transparent;color:var(--muted);cursor:pointer;\n    border-radius:50%;display:grid;place-items:center;transition:color .2s,background .2s}\n  .rc-x svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}\n  .rc-x:hover{color:var(--fg);background:rgba(255,255,255,.05)}\n  .rc-ask{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;\n    background:rgba(var(--acc-rgb),.06);border:1px solid rgba(var(--acc-rgb),.34);color:var(--mint);\n    font-family:var(--serif);font-style:italic;font-size:14px;padding:8px 12px;border-radius:999px;\n    cursor:pointer;transition:border-color .2s,background .2s,transform .15s}\n  .rc-ask svg{width:15px;height:15px;fill:currentColor;flex:none}\n  .rc-ask:hover{border-color:var(--mint);background:rgba(var(--acc-rgb),.1)}\n  .rc-ask:active{transform:scale(.97)}\n  @keyframes rcGo{0%,100%{box-shadow:0 18px 50px -12px rgba(0,0,0,.72),0 0 0 1px rgba(241,207,122,.06)}\n    50%{box-shadow:0 18px 60px -10px rgba(0,0,0,.72),0 0 32px -6px rgba(241,207,122,.34)}}\n\n  /* @episode-start:session */\n  /* EP4: the customizable split. A \"Today's session\" board (a tile per day), the\n     day-view chrome (back link, reorder + settings, day title, split rail), and the\n     Settings sheet (kg/lb toggle + reset). Same tokens, pure black, mint + gold only. */\n\n  /* the two views: a body class flips them, so the library overlay's own\n     .wrap-hiding rule keeps working untouched */\n  #board{display:none;position:relative;z-index:1;width:100%;max-width:1160px;margin:0 auto}\n  body.view-board .wrap{display:none}\n  body.view-board #board{display:block}\n\n  /* board: Today's session */\n  .board-head{margin-bottom:26px}\n  .board-h1{font-family:var(--serif);font-size:40px;line-height:1.02;letter-spacing:-.01em}\n  .board-sub{font-family:var(--serif);font-style:italic;font-size:16px;color:var(--muted-strong);margin-top:6px}\n  .board-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:16px;align-items:stretch}\n  .board-tile{opacity:0;transform:translateY(12px);animation:rise .55s var(--ease) forwards;\n    position:relative;display:flex;flex-direction:column;text-align:left;background:var(--card);border:1px solid var(--rule-strong);border-radius:18px;min-height:158px;\n    padding:20px 20px 18px;cursor:pointer;overflow:hidden;color:var(--fg);font-family:var(--sans);\n    opacity:0;transform:translateY(10px);animation:rise .55s var(--ease) forwards;\n    transition:border-color .2s var(--ease),background .2s var(--ease),transform .15s var(--spring)}\n  .board-tile:hover{border-color:rgba(var(--acc-rgb),.42);background:rgba(var(--acc-rgb),.03)}\n  .board-tile:active{transform:scale(.985)}\n  .board-idx{display:block;font-family:var(--serif);font-style:italic;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}\n  .board-name{display:block;font-family:var(--serif);font-size:27px;line-height:1.05;letter-spacing:-.01em;margin:6px 40px 12px 0;\n    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n  .board-state{display:flex;align-items:center;gap:7px;font-family:var(--serif);font-style:italic;font-size:15px;color:var(--muted-strong);margin-top:auto}\n  .board-state.done{color:var(--mint)}\n  .board-check{flex:none;width:16px;height:16px;color:var(--mint);display:grid;place-items:center}\n  .board-check svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}\n  .board-meta{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:9px;font-variant-numeric:tabular-nums}\n  .board-bar{margin-top:12px;height:2px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}\n  .board-bar span{display:block;height:100%;background:var(--mint);border-radius:2px}\n  .board-menu{position:absolute;top:12px;right:10px;width:30px;height:30px;border:none;background:transparent;color:var(--muted);\n    cursor:pointer;border-radius:8px;display:grid;place-items:center;transition:color .2s,background .2s}\n  .board-menu:hover{color:var(--fg);background:rgba(255,255,255,.05)}\n  .board-menu svg{width:20px;height:20px;fill:currentColor;stroke:none}\n  .board-add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;min-height:118px;\n    background:none;border:1px dashed rgba(var(--acc-rgb),.34);border-radius:18px;color:var(--mint);cursor:pointer;\n    font-family:var(--serif);font-style:italic;font-size:16px;\n    opacity:0;transform:translateY(10px);animation:rise .55s var(--ease) forwards;transition:border-color .2s,background .2s}\n  .board-add:hover{border-color:var(--mint);background:rgba(var(--acc-rgb),.04)}\n  .board-add svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}\n\n  /* day view: header row (back \u00b7 reorder \u00b7 gear), day title, split rail */\n  .day-head{display:flex;align-items:center;gap:10px;margin-bottom:20px}\n  .day-head .sp{flex:1}\n  .day-back{display:inline-flex;align-items:center;gap:8px;background:none;border:none;color:var(--mint);\n    font-family:var(--serif);font-style:italic;font-size:17px;cursor:pointer;padding:4px 2px;transition:color .2s}\n  .day-back:hover{color:var(--mint-cool)}\n  .day-back svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}\n  .day-tool{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule-strong);background:none;color:var(--mint);\n    font-family:var(--serif);font-style:italic;font-size:14px;padding:8px 15px;border-radius:999px;cursor:pointer;\n    transition:border-color .2s,background .2s,transform .12s var(--spring)}\n  .day-tool:hover{border-color:var(--mint);background:rgba(var(--acc-rgb),.05)} .day-tool:active{transform:scale(.96)}\n  .day-tool svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}\n  .day-gear{flex:none;width:38px;height:38px;border:1px solid var(--rule-strong);background:none;color:var(--muted-strong);\n    border-radius:50%;cursor:pointer;display:grid;place-items:center;transition:border-color .2s,color .2s,transform .12s var(--spring)}\n  .day-gear:hover{border-color:var(--mint);color:var(--fg)} .day-gear:active{transform:scale(.94)}\n  .day-gear svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}\n  .day-title{font-family:var(--serif);font-size:34px;line-height:1;letter-spacing:-.01em;margin-bottom:18px;cursor:text;display:flex;align-items:baseline;gap:10px;min-width:0}\n  .day-title .day-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n  .day-title .pen{flex:none;width:15px;height:15px;color:var(--mint);opacity:.28;transform:translateY(-2px);transition:opacity .25s var(--ease)}\n  .day-title .pen svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block}\n  .day-title:hover .pen{opacity:.75}\n  .day-title-edit{font:inherit;letter-spacing:inherit;color:inherit;background:transparent;border:0;border-bottom:1px solid rgba(var(--acc-rgb),.45);outline:none;padding:0 0 2px;width:100%;min-width:0;border-radius:0;caret-color:var(--mint)}\n  /* empty day: one inviting card that leads straight to the library */\n  .day-empty{border:1px dashed rgba(var(--acc-rgb),.28);border-radius:18px;padding:34px 22px;text-align:center;background:radial-gradient(ellipse 80% 100% at 50% 0%,rgba(var(--acc-rgb),.05),transparent 70%)}\n  .day-empty-t{font-family:var(--serif);font-size:23px;margin-bottom:6px}\n  .day-empty-s{font-size:13.5px;color:var(--muted);max-width:30ch;margin:0 auto 18px;line-height:1.5}\n  .day-empty-btn{display:inline-flex;align-items:center;gap:9px;background:var(--mint);color:hsl(var(--hue) 64% 4%);border:0;border-radius:12px;padding:13px 20px;font-family:var(--sans);font-weight:600;font-size:14px;cursor:pointer;transition:transform .35s var(--spring)}\n  .day-empty-btn:active{transform:scale(.97)}\n  .day-empty-btn svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}\n  .split-rail{display:flex;gap:8px;margin-bottom:26px}\n  .rail-seg{flex:1;min-width:0;background:none;border:none;padding:0;cursor:pointer;display:flex;flex-direction:column;gap:7px}\n  .rail-bar{height:4px;border-radius:3px;background:rgba(255,255,255,.1);transition:background .3s var(--ease),box-shadow .3s var(--ease)}\n  .rail-seg.done .rail-bar{background:var(--mint)}\n  .rail-seg.active .rail-bar{background-color:transparent;\n    background-image:repeating-linear-gradient(90deg,var(--mint) 0 6px,transparent 6px 11px);\n    box-shadow:0 0 10px rgba(var(--acc-rgb),.4)}\n  .rail-name{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);\n    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .2s}\n  .rail-seg:hover .rail-name{color:var(--muted-strong)}\n  .rail-seg.done .rail-name{color:var(--mint-cool)}\n  .rail-seg.active .rail-name{color:var(--fg)}\n\n  /* settings sheet + day rename/remove menu (reuse the sheet system) */\n  .set-group{margin-top:4px}\n  .set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 0;border-top:1px solid var(--rule)}\n  .set-row:first-child{border-top:none}\n  .set-lab{min-width:0;display:flex;flex-direction:column}\n  .set-k{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-strong)}\n  .set-cap{font-family:var(--serif);font-style:italic;font-size:13px;color:var(--muted);margin-top:5px;line-height:1.4}\n  .set-danger{margin-top:18px;border-top:1px solid var(--rule);padding-top:16px}\n  .set-reset{display:block;width:100%;text-align:left;background:rgba(255,255,255,.02);border:1px solid var(--rule-strong);\n    border-radius:14px;padding:14px 16px;cursor:pointer;transition:border-color .2s,background .2s}\n  .set-reset:hover{border-color:var(--muted)}\n  .set-reset.armed{border-color:rgba(241,207,122,.5);background:rgba(241,207,122,.06)}\n  .set-reset-t{display:block;font-family:var(--sans);font-weight:600;font-size:14px;color:var(--muted-strong)}\n  .set-reset.armed .set-reset-t{color:var(--gold)}\n  .set-reset-s{display:block;font-family:var(--serif);font-style:italic;font-size:13px;color:var(--muted);margin-top:5px;line-height:1.4}\n  .day-menu{margin-top:6px;display:flex;flex-direction:column;gap:10px}\n  .day-menu-lab{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}\n  .btn-ghost.danger-ghost{border-color:rgba(241,207,122,.5);color:var(--gold)}\n  /* @episode-end:session */\nhtml.booting body>*:not(#splash){visibility:hidden}\n#splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#04060a;color:rgba(255,255,255,.5);font:11px 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.2em;text-transform:uppercase}\n#splash i{width:26px;height:26px;border:3px solid rgba(255,255,255,.1);border-top-color:var(--mint);border-radius:50%;animation:spl .8s linear infinite}@keyframes spl{to{transform:rotate(360deg)}}\n@media(prefers-reduced-motion:reduce){#splash i{animation-duration:2s}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv id=\"splash\">\u003ci>\u003c/i>Loading\u003c/div>\u003ccanvas id=\"snow\">\u003c/canvas>\n\u003cdiv class=\"atmos\">\u003c/div>\n\n\u003c!-- @episode-start:logger -->\n\u003c!-- Episode 2 markup: the workout logger shell (progress rail, list, finish, actions). -->\n\u003cdiv class=\"wrap\">\n  \u003c!-- @episode-start:session -->\n  \u003c!-- Episode 4 markup: the day-view chrome. A back link to the session board, a\n       reorder pill + a settings gear, the active day's name, and the split rail (one\n       segment per day, built from DATA.days). This replaces the old top unit bar. -->\n  \u003cdiv class=\"day-head\">\n    \u003cbutton class=\"day-back\" id=\"dayBack\" aria-label=\"Back to today's session\">\u003csvg viewBox=\"0 0 24 24\">\u003cpath d=\"M15 5l-7 7 7 7\"/>\u003c/svg> Today&rsquo;s session\u003c/button>\n    \u003cspan class=\"sp\">\u003c/span>\n    \u003cbutton class=\"day-tool\" id=\"reorderBtn\">\u003csvg viewBox=\"0 0 24 24\">\u003cpath d=\"M8 5l-3 3 3 3M5 8h9M16 13l3 3-3 3M19 16h-9\"/>\u003c/svg> reorder\u003c/button>\n    \u003cbutton class=\"day-gear\" id=\"settingsBtn\" aria-label=\"Settings\">\u003csvg viewBox=\"0 0 24 24\">\u003ccircle cx=\"12\" cy=\"12\" r=\"3\">\u003c/circle>\u003cpath d=\"M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z\">\u003c/path>\u003c/svg>\u003c/button>\n  \u003c/div>\n  \u003ch1 class=\"day-title\" id=\"dayTitle\">\u003c/h1>\n  \u003cdiv class=\"split-rail\" id=\"splitRail\">\u003c/div>\n  \u003c!-- @episode-end:session -->\n\n  \u003cdiv class=\"top\">\n    \u003cdiv class=\"track\">\u003cdiv class=\"fill\" id=\"fill\">\u003c/div>\u003c/div>\n    \u003cdiv class=\"count\" id=\"count\">\u003c/div>\n  \u003c/div>\n\n  \u003cdiv id=\"list\">\u003c/div>\n\n  \u003cdiv class=\"finish-wrap\" id=\"finishWrap\">\n    \u003cbutton class=\"finish\" id=\"finishBtn\">\u003csvg viewBox=\"0 0 24 24\">\u003cpath d=\"M4 12l5 5L20 6\"/>\u003c/svg> Finish session\u003c/button>\n    \u003cdiv class=\"finish-cap\" id=\"finishCap\">\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"actions\" id=\"actions\">\n    \u003cbutton class=\"act-btn\" id=\"libOpen\">\u003csvg viewBox=\"0 0 24 24\">\u003cpath d=\"M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z\"/>\u003c/svg> Add a lift\u003c/button>\n  \u003c/div>\n\n  \u003cdiv id=\"hidden\">\u003c/div>\n\n  \u003cp class=\"footnote\">Saved on this device. Log a set, close the tab, it is still here.\u003c/p>\n\u003c/div>\n\n\u003c!-- @episode-start:session -->\n\u003c!-- Episode 4 markup: the \"Today's session\" board. A tile per day in your split,\n     built by renderBoard() from DATA.days. This is the screen the logger opens on. -->\n\u003cdiv id=\"board\">\u003c/div>\n\u003c!-- @episode-end:session -->\n\n\u003cdiv class=\"modal\" id=\"modal\">\u003cdiv class=\"sheet\" id=\"sheet\">\u003c/div>\u003c/div>\n\u003cdiv class=\"po-modal\" id=\"poModal\">\u003cdiv class=\"po-card\" id=\"poCard\">\u003c/div>\u003c/div>\n\u003cdiv class=\"cele\" id=\"cele\">\u003cdiv class=\"cele-card\" id=\"celeCard\">\u003c/div>\u003c/div>\n\u003c!-- @episode-end:logger -->\n\n\u003c!-- @episode-start:library -->\n\u003c!-- Episode 3 markup: the full-page exercise library overlay (built by JS). -->\n\u003cdiv class=\"lib-overlay\" id=\"libOverlay\">\u003c/div>\n\u003c!-- @episode-end:library -->\n\n\u003c!-- @episode-start:chart -->\n\u003c!-- Episode 1 markup: the progressive-overload history overlay (built inline by JS). -->\n\u003cdiv class=\"ep1-overlay\" id=\"ep1Overlay\">\n  \u003cbutton class=\"ep1-close\" id=\"ep1Close\" aria-label=\"Back to session\">\u003csvg viewBox=\"0 0 24 24\">\u003cpath d=\"M15 5l-7 7 7 7\"/>\u003c/svg> session\u003c/button>\n  \u003cdiv class=\"ch-shell\" id=\"ep1Shell\">\u003c/div>\n\u003c/div>\n\u003c!-- @episode-end:chart -->\n\n\u003c!-- @episode-start:rest-timer -->\n\u003c!-- Episode 4 markup: the rest coach. A floating card that appears when you log a set:\n     a countdown ring, the set you just did, and what is next. -->\n\u003cdiv class=\"rest-coach\" id=\"restCoach\" hidden>\n  \u003cbutton class=\"rc-step\" id=\"rcMinus\" aria-label=\"15 seconds less\">&minus;15\u003c/button>\n  \u003cdiv class=\"rc-mid\">\n    \u003cdiv class=\"rc-time\" id=\"rcTime\">0:00\u003c/div>\n    \u003cdiv class=\"rc-ex\" id=\"rcLiftName\">Lift\u003c/div>\n  \u003c/div>\n  \u003cbutton class=\"rc-step\" id=\"rcPlus\" aria-label=\"15 seconds more\">+15\u003c/button>\n  \u003cbutton class=\"rc-x\" id=\"rcDismiss\" aria-label=\"Dismiss rest timer\">\u003csvg viewBox=\"0 0 24 24\">\u003cpath d=\"M6 6l12 12M18 6L6 18\"/>\u003c/svg>\u003c/button>\n\u003c/div>\n\u003c!-- @episode-end:rest-timer -->\n\n\u003cscript type=\"text/plain\" id=\"app-src\">\n  // ====================================================================\n  //  THE LIVING LOGGER. Three features grown one episode at a time, sharing\n  //  one localStorage store and one render loop:\n  //    chart   (ep1) progressive-overload history, drawn from a lift's sets\n  //    logger  (ep2) the workout logger: cards, graded set rows, the whole loop\n  //    library (ep3) the exercise catalog you add and swap lifts from\n  //  Each block below is wrapped in @episode-start / @episode-end markers so a\n  //  factory script can cut any single episode's slice.\n  // ====================================================================\n\n  const GLYPH = {\n    chest:'\u003cpath d=\"M3 9c2.5-2.4 6-2.4 9 .2c3-2.6 6.5-2.6 9-.2\"/>\u003cpath d=\"M12 9.2c0 4-3.2 6-9 5.6M12 9.2c0 4 3.2 6 9 5.6\"/>',\n    shoulders:'\u003cpath d=\"M4 16a8 8 0 0 1 16 0\"/>\u003ccircle cx=\"12\" cy=\"8\" r=\"2.2\"/>',\n    arms:'\u003cpath d=\"M8 4v7a4 4 0 0 0 8 0V4\"/>\u003cpath d=\"M6 4h4M14 4h4\"/>',\n    back:'\u003cpath d=\"M12 4v15\"/>\u003cpath d=\"M12 7c-2.6 0-5 1.7-7 5M12 7c2.6 0 5 1.7 7 5\"/>',\n    legs:'\u003cpath d=\"M9 4l-1 8-2 8M15 4l1 8 2 8\"/>\u003cpath d=\"M8 4h8\"/>',\n    core:'\u003cpath d=\"M7.5 5h9M7.5 10h9M7.5 15h9M12 5v13\"/>',\n  };\n  const SVG = inner => '\u003csvg viewBox=\"0 0 24 24\">' + inner + '\u003c/svg>';\n  const ICON = {\n    swap:'\u003cpath d=\"M4 8h13l-3-3M20 16H7l3 3\"/>',\n    history:'\u003cpath d=\"M4 18l5-6 3 3 6-8\"/>\u003cpath d=\"M16 7h3v3\"/>',\n    tune:'\u003cpath d=\"M4 8h10M18 8h2M4 16h4M12 16h8\"/>\u003ccircle cx=\"16\" cy=\"8\" r=\"2\"/>\u003ccircle cx=\"10\" cy=\"16\" r=\"2\"/>',\n    star:'\u003cpath d=\"M12 2l2.9 6.1 6.6.9-4.8 4.6 1.2 6.6L12 18.5 6.1 20.8l1.2-6.6L2.5 9.6l6.6-.9z\"/>',\n    weight:'\u003cpath d=\"M4 9v6M7 7.5v9M17 7.5v9M20 9v6M7 12h10\"/>',\n    sets:'\u003cpath d=\"M12 3 20 7 12 11 4 7Z\"/>\u003cpath d=\"M4 12 12 16 20 12\"/>\u003cpath d=\"M4 17 12 21 20 17\"/>',\n    reps:'\u003cpath d=\"M17 3l3 3-3 3\"/>\u003cpath d=\"M20 6H9a5 5 0 0 0-5 5\"/>\u003cpath d=\"M7 21l-3-3 3-3\"/>\u003cpath d=\"M4 18h11a5 5 0 0 0 5-5\"/>',\n    rest:'\u003ccircle cx=\"12\" cy=\"13\" r=\"8\"/>\u003cpath d=\"M12 13V9M12 13l3 2M9 3h6\"/>',\n    eye:'\u003cpath d=\"M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z\"/>\u003ccircle cx=\"12\" cy=\"12\" r=\"3\"/>',\n    arrow:'\u003cpath d=\"M4 12h14M13 7l5 5-5 5\"/>',\n    search:'\u003ccircle cx=\"11\" cy=\"11\" r=\"7\"/>\u003cpath d=\"M21 21l-4.3-4.3\"/>',\n  };\n\n  function esc(s){ return String(s).replace(/[&\u003c>\"]/g, c => ({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;'}[c])); }\n\n  // @episode-start:logger\n  // ONE store, never one-per-feature. The lifts live in memory as LIFTS, and\n  // these five functions are the only doorway to disk. Everything goes through\n  // them: logging a set, swap, tune, star, even the overload chart. You read\n  // with getLift, write with updateLift or addLift, and saveLog puts it on disk.\n  // Point saveLog/loadLog at Supabase instead of localStorage and every feature\n  // syncs across devices, untouched (backend.sql).\n  const STORE = 'vitality.logger.v3';        // legacy flat v3 store (a bare LIFTS array), kept only to migrate\n  const STORE2 = 'vitality.logger.v4';       // ep4/session: the split store. { days:[{id,name,lifts}], activeDayId }\n  // Only the lab exhibit (?demo=1) opens with the lively seeded split. A real\n  // person opens CLEAN and picks their own split: their lifts, their numbers,\n  // nothing pre-filled. Nobody ever inherits someone else's training data.\n  const DEMO_MODE = /[?&#]demo\\b/.test(location.search + '&' + location.hash);\n  let FRESH_START = false;\n  // Entrances play when a day OPENS. Re-renders while logging must never\n  // replay them (cards restarting at opacity 0 reads as a blank-screen flash).\n  let liftAnimOnce = false;\n  let DATA = null;                            // the whole split lives here; LIFTS below is a live ref to one day's lifts\n  let LIFTS = [];                             // the ACTIVE day's lifts. Every Episode 1-3 lift function still reads/writes THIS array.\n  // loadLog now hydrates a whole split. v4 first; else migrate a v3 flat list into a\n  // single \"Day 1\"; else seed a real Push/Pull/Legs/Rest split. It never opens blank.\n  function loadLog(){\n    DATA = null;\n    try { const raw = localStorage.getItem(STORE2); if (raw){ const d = JSON.parse(raw); if (d && Array.isArray(d.days) && d.days.length) DATA = d; } } catch(e){}\n    if (!DATA){\n      try {\n        const rawOld = localStorage.getItem(STORE);\n        if (rawOld){ const a = JSON.parse(rawOld); if (Array.isArray(a) && a.length){ const id = uid(); DATA = { days: [{ id, name: 'Day 1', lifts: a }], activeDayId: id }; } }\n      } catch(e){}\n    }\n    // The old builds seeded demo data into REAL storage. If what we loaded is\n    // that exact seed fingerprint (Barbell bench 85 with the generated 6-step\n    // 72.5 history), it is not the user's training: wipe it and start them\n    // clean. A real person's data can never match this fingerprint.\n    if (!DEMO_MODE && DATA){\n      try {\n        const p = (DATA.days || []).find(x => x.name === 'Push');\n        const b = p && (p.lifts || []).find(l => l.name === 'Barbell bench');\n        if (b && b.weight === 85 && Array.isArray(b.history) && b.history.length === 6 && b.history[0] && b.history[0].w === 72.5) DATA = null;\n      } catch(e){}\n    }\n    if (!DATA || !Array.isArray(DATA.days) || !DATA.days.length){\n      if (DEMO_MODE){ DATA = seedSplit(); }\n      else { const id = uid(); DATA = { days:[{ id, name:'Day 1', lifts:[] }], activeDayId:id }; FRESH_START = true; }\n    }\n    DATA.days.forEach(d => { if (!Array.isArray(d.lifts)) d.lifts = []; });         // a day always has a lifts array\n    if (!DATA.days.find(d => d.id === DATA.activeDayId)) DATA.activeDayId = DATA.days[0].id;\n    LIFTS = activeDay().lifts;\n    saveLog();\n    return LIFTS;\n  }\n  function saveLog(){ try { localStorage.setItem(STORE2, JSON.stringify(DATA)); } catch(e){} if (window.__cloudSave) window.__cloudSave(); }\n  function getLift(id){ return LIFTS.find(l => l.id === id); }\n  function updateLift(id, patch){\n    const lift = getLift(id); if (!lift) return;\n    Object.assign(lift, typeof patch === 'function' ? patch(lift) : patch);\n    saveLog();\n  }\n  function addLift(fields){\n    LIFTS.push({ id: uid(), hidden:false, rest:150, history:[], ...fields });\n    saveLog();\n  }\n\n  const uid = () => 'l' + Math.random().toString(36).slice(2,9);\n  const blankSets = n => Array.from({length:n}, () => ({ weight:null, reps:null, done:false, failed:false }));\n  // a few past sessions so \"history\" has a real line to draw (top-set weight)\n  const hist = (base, step, reps) => Array.from({length:6}, (_,i) => ({ w: base + i*step, r: reps }));\n\n  // demo seed. Starting examples; the user adds their own from the library.\n  const SEED = [\n    { name:'Barbell bench',         tier:1, muscle:'chest',     targetSets:4, targetReps:5,  weight:85,   history:hist(72.5,2.5,5) },\n    { name:'Incline DB press',      tier:2, muscle:'chest',     targetSets:3, targetReps:9,  weight:32.5, perHand:true, history:hist(26,1.5,9) },\n    { name:'Standing barbell OHP',  tier:1, muscle:'shoulders', targetSets:3, targetReps:6,  weight:52.5, history:hist(45,1.5,6) },\n    { name:'Tricep rope pushdown',  tier:3, muscle:'arms',      targetSets:3, targetReps:10, weight:32.5, history:hist(25,1.5,10) },\n    { name:'Overhead cable tri ext',tier:3, muscle:'arms',      targetSets:2, targetReps:12, weight:25,   history:hist(17.5,1.5,12) },\n    { name:'DB lateral raise',      tier:3, muscle:'shoulders', targetSets:3, targetReps:12, weight:14,   perHand:true, history:hist(9,1,12) },\n  ];\n  // @episode-end:logger\n\n  // @episode-start:library\n  // THE REAL VITALITY \"TRAIN\" LIBRARY: 57 lifts pulled straight from the app.\n  // Every one carries its own official info card: muscles, tier, equipment, a\n  // one-line gist, coach steps, cue pills and two form photos. This is what turns\n  // \"add a lift\" into a real library instead of a blank name box. Photos load from\n  // our live prod assets so this stays one portable file; if they are offline the\n  // card still renders, just without the pictures. A lift added from here is a full\n  // lift, saved through the same STORE as everything else.\n  const LIB = [\n  {key:\"bench_bb\",name:\"Barbell bench\",group:\"chest\",muscles:\"Chest \u00b7 Front delts \u00b7 Triceps\",tier:1,equip:\"barbell\",img:\"bench_bb\",rec:true,gist:\"The barbell chest builder.\",steps:[\"Unrack over your chest\",\"Lower slow to your neck\",\"Press up and squeeze\"],cues:[\"Lower slower than you press\",\"Squeeze chest at lockout\",\"Wrists stacked over elbows. Tuck the elbows slightly, drive into the bar, hold the arch.\"]},\n  {key:\"incl_bb_bench\",name:\"Incline barbell bench\",group:\"chest\",muscles:\"Chest \u00b7 Front delts \u00b7 Triceps\",tier:1,equip:\"barbell\",img:\"incl_bb_bench\",rec:true,gist:\"Incline barbell upper-chest press.\",steps:[\"Unrack over upper chest\",\"Lower slow to upper chest\",\"Press up and squeeze\"],cues:[\"Lower slower than you press\",\"Squeeze chest at lockout\",\"30 degree incline max. Any higher and it becomes shoulder press. Touch upper chest.\"]},\n  {key:\"flat_db_press\",name:\"Flat DB press\",group:\"chest\",muscles:\"Chest \u00b7 Front delts \u00b7 Triceps\",tier:2,equip:\"dumbbell\",img:null,rec:true,gist:\"Flat dumbbell chest press.\",steps:[\"Dumbbells at your chest, palms forward\",\"Press up over your chest\",\"Lower slow to a stretch\"],cues:[\"Wrists stacked over elbows\",\"Lower slower than you press\"]},\n  {key:\"incl_db_press\",name:\"Incline DB press\",group:\"chest\",muscles:\"Chest \u00b7 Front delts \u00b7 Triceps\",tier:2,equip:\"dumbbell\",img:\"incl_db_press\",rec:true,gist:\"Incline dumbbell upper-chest press.\",steps:[\"Dumbbells at shoulder width, palms forward\",\"Press up with your chest\",\"Lower slow\"],cues:[\"Lower slower than you press\",\"Stay in full control\",\"30 degree incline. Lower DBs to upper chest. Squeeze pecs at top.\"]},\n  {key:\"machine_chest\",name:\"Machine chest press\",group:\"chest\",muscles:\"Chest \u00b7 Front delts \u00b7 Triceps\",tier:2,equip:\"machine\",img:\"machine_chest\",rec:false,gist:\"Machine chest press.\",steps:[\"Upper arms parallel, palms down\",\"Press the handles out\",\"Return slow\"],cues:[\"Hold the squeeze a beat\",\"Back flat on the pad\"]},\n  {key:\"dips_weighted\",name:\"Weighted dips\",group:\"chest\",muscles:\"Chest \u00b7 Triceps \u00b7 Front delts\",tier:1,equip:\"body only\",img:\"dips_weighted\",rec:true,gist:\"Weighted triceps dip.\",steps:[\"Hang at arm's length\",\"Lower to 90 degrees\",\"Press back up\"],cues:[\"Torso upright\",\"Elbows close to body\",\"Lean forward 15 degrees for chest bias. Lower until shoulders below elbows. Strict, no kipping.\"]},\n  {key:\"close_grip\",name:\"Close-grip bench\",group:\"arms\",muscles:\"Triceps \u00b7 Chest \u00b7 Front delts\",tier:2,equip:\"barbell\",img:\"close_grip\",rec:false,gist:\"Close-grip triceps bench.\",steps:[\"Unrack, shoulder-width grip\",\"Lower slow to mid chest\",\"Press up with triceps\"],cues:[\"Elbows close to your torso\",\"Lower slower than you press\",\"Hands shoulder-width. Elbows tucked. All triceps, no flare.\"]},\n  {key:\"cable_fly\",name:\"Cable chest fly\",group:\"chest\",muscles:\"Chest\",tier:3,equip:\"cable\",img:null,rec:true,gist:\"Cable fly for the chest.\",steps:[\"Handles high, soft bend in the elbows\",\"Bring your hands together out front\",\"Return wide with control\"],cues:[\"Lock the elbow angle\",\"Squeeze the chest in the middle\"]},\n  {key:\"pec_deck\",name:\"Pec deck\",group:\"chest\",muscles:\"Chest\",tier:3,equip:\"machine\",img:\"pec_deck\",rec:false,gist:\"Machine chest fly.\",steps:[\"Back flat, grip handles\",\"Push together, squeeze chest\",\"Return for a stretch\"],cues:[\"Upper arms parallel to floor\",\"Squeeze in the middle\"]},\n  {key:\"standing_ohp\",name:\"Standing barbell OHP\",group:\"shoulders\",muscles:\"Front delts \u00b7 Triceps \u00b7 Side delts\",tier:1,equip:\"barbell\",img:\"standing_ohp\",rec:true,gist:\"Standing barbell shoulder press.\",steps:[\"Bar on upper back, stand tall\",\"Press overhead to lockout\",\"Lower under control\"],cues:[\"Keep your back straight\",\"Full lockout overhead\",\"Bar over mid-foot. Squeeze glutes, brace abs. Press straight, head through at lockout.\"]},\n  {key:\"seated_db_ohp\",name:\"Seated DB shoulder press\",group:\"shoulders\",muscles:\"Front delts \u00b7 Triceps \u00b7 Side delts\",tier:2,equip:\"dumbbell\",img:\"seated_db_ohp\",rec:true,gist:\"Seated dumbbell shoulder press.\",steps:[\"Dumbbells at shoulders, palms forward\",\"Press up till they meet\",\"Lower slow\"],cues:[\"Use thighs to get them up\",\"Press straight overhead\",\"Back flat against pad. DBs at ear level start. Press up and slightly in.\"]},\n  {key:\"machine_ohp\",name:\"Machine shoulder press\",group:\"shoulders\",muscles:\"Front delts \u00b7 Triceps \u00b7 Side delts\",tier:2,equip:\"machine\",img:\"machine_ohp\",rec:false,gist:\"Smith machine shoulder press.\",steps:[\"Sit, bar lined up with your nose\",\"Lower to chin level\",\"Press back up\"],cues:[\"Feet planted\",\"Press straight overhead\"]},\n  {key:\"push_press\",name:\"Push press\",group:\"shoulders\",muscles:\"Front delts \u00b7 Triceps \u00b7 Quads\",tier:1,equip:\"barbell\",img:\"push_press\",rec:false,gist:\"Leg-driven overhead press.\",steps:[\"Bar racked at shoulders\",\"Dip, then drive up\",\"Press overhead to lockout\"],cues:[\"Start the drive with legs\",\"Lock out over your head\",\"Quarter-dip with the legs, drive through the floor, finish with the arms.\"]},\n  {key:\"db_lat_raise\",name:\"DB lateral raise\",group:\"shoulders\",muscles:\"Side delts\",tier:3,equip:\"dumbbell\",img:null,rec:true,gist:\"Dumbbell side-delt raise.\",steps:[\"Dumbbells at your sides, soft elbows\",\"Raise out to shoulder height\",\"Lower slow\"],cues:[\"Lead with your elbows\",\"Stay tall, no swinging\"]},\n  {key:\"cable_lat_raise\",name:\"Cable lateral raise\",group:\"shoulders\",muscles:\"Side delts\",tier:3,equip:\"cable\",img:\"cable_lat_raise\",rec:true,gist:\"Seated cable side-delt raise.\",steps:[\"Sit between pulleys, cross grip\",\"Bend forward over thighs\",\"Raise arms out to sides\"],cues:[\"Arms perpendicular to torso\",\"Fixed slight elbow bend\",\"Cable from far side, behind body. Sweep across body and up.\"]},\n  {key:\"rear_delt_fly\",name:\"Rear delt cable fly\",group:\"shoulders\",muscles:\"Rear delts\",tier:3,equip:\"cable\",img:\"rear_delt_fly\",rec:true,gist:\"Cable rear-delt fly.\",steps:[\"Cross grip, pulleys high\",\"Pull arms back and out\",\"Return slow\"],cues:[\"Keep arms straight\",\"Motion from the shoulders\"]},\n  {key:\"reverse_pec\",name:\"Reverse pec deck\",group:\"shoulders\",muscles:\"Rear delts\",tier:3,equip:\"machine\",img:\"reverse_pec\",rec:true,gist:\"Machine rear-delt fly.\",steps:[\"Handles at shoulder level\",\"Pull out and back\",\"Return slow\"],cues:[\"Motion at the shoulders\",\"Slight bend in arms\"]},\n  {key:\"tri_pushdown\",name:\"Tricep rope pushdown\",group:\"arms\",muscles:\"Triceps\",tier:3,equip:\"cable\",img:\"tri_pushdown\",rec:true,gist:\"Rope triceps pushdown.\",steps:[\"Rope at high pulley, elbows in\",\"Push down to your thighs\",\"Return slow\"],cues:[\"Upper arms by your sides\",\"Only the forearms move\"]},\n  {key:\"oh_tri_ext\",name:\"Overhead cable tri ext\",group:\"arms\",muscles:\"Triceps\",tier:3,equip:\"cable\",img:\"oh_tri_ext\",rec:true,gist:\"Overhead cable triceps extension.\",steps:[\"Rope overhead, elbows in\",\"Lower behind your head\",\"Extend back up\"],cues:[\"Upper arms stay still\",\"Full stretch at the bottom\"]},\n  {key:\"skullcrushers\",name:\"Skullcrushers\",group:\"arms\",muscles:\"Triceps\",tier:3,equip:\"e-z curl bar\",img:\"skullcrushers\",rec:false,gist:\"EZ-bar triceps extension.\",steps:[\"Lie down, arms vertical\",\"Lower bar to your forehead\",\"Extend back up\"],cues:[\"Upper arms stay st down on the pad\",\"Pull weight up, squeeze back\",\"Lower slow\"],cues:[\"Upper arms close to torso\",\"Stay on the pad\"]},\n  {key:\"seated_cable_row\",name:\"Seated cable row\",group:\"back\",muscles:\"Mid back \u00b7 Lats \u00b7 Biceps\",tier:2,equip:\"cable\",img:null,rec:true,gist:\"Seated cable back row.\",steps:[\"Chest up, grab the handle\",\"Pull it to your stomach\",\"Return with control\"],cues:[\"Drive your elbows back\",\"Squeeze your shoulder blades\"]},\n  {key:\"chest_supp_row\",name:\"Chest-supported DB row\",group:\"back\",muscles:\"Mid back \u00b7 Lats \u00b7 Biceps \u00b7 Rear delts\",tier:2,equip:\"dumbbell\",img:\"chest_supp_row\",rec:true,gist:\"Chest-supported upper-back row.\",steps:[\"Lean into an incline bench\",\"Row dumbbells to your sides\",\"Pause, then lower\"],cues:[\"Neutral grip\",\"Squeeze blades at the top\",\"Bench at 30 degrees, lay flat. Drive elbows up and back. Squeeze, no bounce.\"]},\n  {key:\"single_arm_row\",name:\"Single-arm DB row\",group:\"back\",muscles:\"Lats \u00b7 Mid back \u00b7 Biceps\",tier:2,equip:\"dumbbell\",img:\"single_arm_row\",rec:false,gist:\"One-arm dumbbell back row.\",steps:[\"Knee and hand on bench\",\"Row dumbbell to your chest\",\"Lower slow, then switch\"],cues:[\"Drive with your back\",\"Upper arm close, torso still\",\"Brace the working side with the opposite hand. Pull to the hip, not the chest.\"]},\n  {key:\"lat_pulldown\",name:\"Lat pulldown\",group:\"back\",muscles:\"Lats \u00b7 Biceps \u00b7 Mid back\",tier:2,equip:\"cable\",img:\"lat_pulldown\",rec:true,gist:\"Lat pulldown.\",steps:[\"Grip handle overhand\",\"Pull elbow to your side\",\"Return slow\"],cues:[\"Keep tension on the lats\",\"Drive the elbow down\",\"Slight lean back, drive elbows down and back. Stop at upper chest.\"]},\n  {key:\"face_pull\",name:\"Cable face pull\",group:\"shoulders\",muscles:\"Rear delts \u00b7 Mid back\",tier:3,equip:\"cable\",img:\"face_pull\",rec:true,gist:\"Cable rear-delt pull.\",steps:[\"Face a hig
